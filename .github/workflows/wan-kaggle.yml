name: Wan2.1 Image-to-Video (Kaggle GPU)

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Prompt de génération vidéo'
        required: true
        type: string
      image_base64:
        description: 'Image source base64 (compressée 512px côté app)'
        required: true
        type: string
      duration:
        description: 'Durée en secondes (5 ou 10)'
        required: false
        default: '5'
        type: string
      aspect_ratio:
        description: 'Ratio vidéo (9:16, 16:9, 1:1)'
        required: false
        default: '9:16'
        type: string

jobs:
  launch-kaggle:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Push kernel via Kaggle REST API v1
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY:      ${{ secrets.KAGGLE_KEY }}
          GH_TOKEN:        ${{ secrets.GITHUB_TOKEN }}
          GH_REPO:         ${{ github.repository }}
          PROMPT:          ${{ inputs.prompt }}
          IMAGE_BASE64:    ${{ inputs.image_base64 }}
          DURATION:        ${{ inputs.duration }}
          ASPECT_RATIO:    ${{ inputs.aspect_ratio }}
        run: |
          python3 - << 'PYEOF'
          import os, json, requests, time

          KG_USER  = os.environ['KAGGLE_USERNAME']
          KG_KEY   = os.environ['KAGGLE_KEY']
          GH_TOKEN = os.environ['GH_TOKEN']
          GH_REPO  = os.environ['GH_REPO']
          PROMPT   = os.environ['PROMPT']
          IMG_B64  = os.environ['IMAGE_BASE64']
          DURATION = os.environ.get('DURATION', '5')
          RATIO    = os.environ.get('ASPECT_RATIO', '9:16')
          RUN_ID   = str(int(time.time()))

          KG_AUTH = (KG_USER, KG_KEY)
          KG_BASE = 'https://www.kaggle.com/api/v1'
          KERNEL_SLUG = 'viravid-i2v'
          # title doit slugifier exactement vers KERNEL_SLUG
          # slug = lower + replace spaces with dashes
          KERNEL_TITLE = 'viravid i2v'

          # Lire le notebook
          nb_path = '.github/workflows/wan-i2v.ipynb'
          with open(nb_path) as f:
              nb = json.load(f)

          # Injecter les paramètres en première cellule
          inject = {
              "cell_type": "code",
              "execution_count": None,
              "metadata": {},
              "outputs": [],
              "source": [
                  "import os\n",
                  f"os.environ['PROMPT']       = {json.dumps(PROMPT)}\n",
                  f"os.environ['IMAGE_BASE64'] = {json.dumps(IMG_B64)}\n",
                  f"os.environ['DURATION']     = {json.dumps(DURATION)}\n",
                  f"os.environ['ASPECT_RATIO'] = {json.dumps(RATIO)}\n",
                  f"os.environ['GH_TOKEN']     = {json.dumps(GH_TOKEN)}\n",
                  f"os.environ['GH_REPO']      = {json.dumps(GH_REPO)}\n",
                  f"os.environ['RUN_ID']       = {json.dumps(RUN_ID)}\n",
                  "print('Env vars OK')\n"
              ]
          }
          nb['cells'].insert(0, inject)

          payload = {
              "id":            f"{KG_USER}/{KERNEL_SLUG}",
              "title":         KERNEL_TITLE,
              "newTitle":      KERNEL_TITLE,
              "language":      "python",
              "kernelType":    "notebook",
              "isPrivate":     True,
              "enableGpu":     True,
              "enableTpu":     False,
              "enableInternet": True,
              "datasetDataSources":     [],
              "kernelDataSources":      [],
              "competitionDataSources": [],
              "categoryIds":            [],
              "source":        json.dumps(nb),
          }

          print(f'Push kernel {KG_USER}/{KERNEL_SLUG}...')
          r = requests.post(f'{KG_BASE}/kernels/push', auth=KG_AUTH, json=payload, timeout=30)
          print(f'Status: {r.status_code}  Body: {r.text[:300]}')

          if r.status_code not in (200, 201):
              raise SystemExit(f'Push échoué: {r.status_code} — {r.text[:200]}')

          print(f'Kernel lancé — RUN_ID={RUN_ID}')

          with open('/tmp/run_id.txt', 'w') as f:
              f.write(RUN_ID)
          PYEOF

      - name: Poll kernel + attendre Release GitHub
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY:      ${{ secrets.KAGGLE_KEY }}
          GH_TOKEN:        ${{ secrets.GITHUB_TOKEN }}
          GH_REPO:         ${{ github.repository }}
        run: |
          python3 - << 'PYEOF'
          import os, requests, time

          KG_USER  = os.environ['KAGGLE_USERNAME']
          KG_KEY   = os.environ['KAGGLE_KEY']
          GH_TOKEN = os.environ['GH_TOKEN']
          GH_REPO  = os.environ['GH_REPO']
          KG_AUTH  = (KG_USER, KG_KEY)
          KG_BASE  = 'https://www.kaggle.com/api/v1'
          KERNEL_SLUG = 'viravid-i2v'

          with open('/tmp/run_id.txt') as f:
              RUN_ID = f.read().strip()

          TAG = f'viravid-{RUN_ID}'
          GH_HEADERS = {
              'Authorization': f'token {GH_TOKEN}',
              'Accept': 'application/vnd.github.v3+json'
          }

          print(f'Poll kernel + Release (tag: {TAG})...')
          max_wait, interval, elapsed = 1200, 20, 0

          while elapsed < max_wait:
              time.sleep(interval)
              elapsed += interval

              # Statut kernel
              kr = requests.get(f'{KG_BASE}/kernels/{KG_USER}/{KERNEL_SLUG}',
                                 auth=KG_AUTH, timeout=15)
              if kr.status_code == 200:
                  kd = kr.json()
                  # Extraire le statut depuis la structure imbriquée
                  lrv = kd.get('currentRunningVersion') or kd.get('lastRunningVersion') or {}
                  if isinstance(lrv, dict):
                      kstatus = lrv.get('status', kd.get('status', '?'))
                  else:
                      kstatus = str(lrv)
                  print(f'[{elapsed}s] Kaggle: {kstatus}')
                  if kstatus in ('error', 'cancelAcknowledged', 'cancelled'):
                      log_r = requests.get(
                          f'{KG_BASE}/kernels/{KG_USER}/{KERNEL_SLUG}/output',
                          auth=KG_AUTH, timeout=15)
                      print('Kaggle log:', log_r.text[:800])
                      raise SystemExit('Kernel en erreur')
              else:
                  print(f'[{elapsed}s] Kaggle {kr.status_code}: {kr.text[:100]}')

              # Chercher la Release
              rel_r = requests.get(
                  f'https://api.github.com/repos/{GH_REPO}/releases/tags/{TAG}',
                  headers=GH_HEADERS, timeout=10)
              if rel_r.status_code == 200:
                  assets = rel_r.json().get('assets', [])
                  if assets:
                      dl_url = assets[0]['browser_download_url']
                      print(f'Video ready: {dl_url}')
                      with open('/tmp/video_url.txt', 'w') as f:
                          f.write(dl_url)
                      summary = os.environ.get('GITHUB_STEP_SUMMARY', '/dev/null')
                      with open(summary, 'a') as f:
                          f.write(f'## Video ready\n**URL:** {dl_url}\n**Tag:** `{TAG}`\n')
                      break
              else:
                  print(f'  Release {rel_r.status_code}')
          else:
              raise SystemExit('Timeout > 20 min')
          PYEOF

      - name: Upload video URL
        uses: actions/upload-artifact@v4
        with:
          name: video-url
          path: /tmp/video_url.txt
          retention-days: 1
          if-no-files-found: warn
