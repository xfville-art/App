name: Wan2.1 Image-to-Video (fal.ai)

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Prompt de génération vidéo'
        required: true
        type: string
      image_base64:
        description: 'Image source base64 compressée'
        required: true
        type: string
      duration:
        required: false
        default: '5'
        type: string
      aspect_ratio:
        required: false
        default: '9:16'
        type: string

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Generate video via fal.ai
        env:
          FAL_KEY:     ${{ secrets.FAL_KEY }}
          GH_TOKEN:    ${{ secrets.GITHUB_TOKEN }}
          GH_REPO:     ${{ github.repository }}
          PROMPT:      ${{ inputs.prompt }}
          IMAGE_B64:   ${{ inputs.image_base64 }}
          DURATION:    ${{ inputs.duration }}
          ASPECT:      ${{ inputs.aspect_ratio }}
        run: |
          python3 - << 'PYEOF'
          import os, requests, time, json, base64

          FAL_KEY   = os.environ['FAL_KEY']
          GH_TOKEN  = os.environ['GH_TOKEN']
          GH_REPO   = os.environ['GH_REPO']
          PROMPT    = os.environ['PROMPT']
          IMG_B64   = os.environ['IMAGE_B64']
          DURATION  = os.environ.get('DURATION', '5')
          ASPECT    = os.environ.get('ASPECT', '9:16')
          RUN_ID    = str(int(time.time()))

          FAL_HEADERS = {
              'Authorization': f'Key {FAL_KEY}',
              'Content-Type': 'application/json'
          }
          GH_HEADERS = {
              'Authorization': f'token {GH_TOKEN}',
              'Accept': 'application/vnd.github.v3+json'
          }

          # ── 1. Upload image vers fal.ai storage ──────────────────────────
          print('📤 Upload image vers fal.ai...')
          img_bytes = base64.b64decode(IMG_B64)

          # fal storage upload
          up = requests.post(
              'https://rest.alpha.fal.ai/storage/upload/initiate',
              headers=FAL_HEADERS,
              json={'file_name': 'source.jpg', 'content_type': 'image/jpeg'},
              timeout=15
          )
          if up.status_code not in (200, 201):
              # Fallback: upload direct via fal files API
              up2 = requests.post(
                  'https://fal.run/fal-ai/storage/upload',
                  headers={'Authorization': f'Key {FAL_KEY}'},
                  files={'file': ('source.jpg', img_bytes, 'image/jpeg')},
                  timeout=30
              )
              if up2.status_code not in (200, 201):
                  print(f'Upload status: {up2.status_code} {up2.text[:200]}')
                  raise SystemExit('Upload image échoué')
              image_url = up2.json().get('url') or up2.json().get('access_url')
          else:
              upload_data = up.json()
              upload_url  = upload_data.get('upload_url')
              image_url   = upload_data.get('file_url') or upload_data.get('access_url')
              # PUT vers S3
              put_r = requests.put(
                  upload_url,
                  data=img_bytes,
                  headers={'Content-Type': 'image/jpeg'},
                  timeout=30
              )
              put_r.raise_for_status()

          print(f'✓ Image URL: {image_url}')

          # ── 2. Soumettre le job Wan I2V ──────────────────────────────────
          print('🚀 Soumission job fal-ai/wan-i2v...')
          ENDPOINT = 'fal-ai/wan-i2v'

          payload = {
              'prompt':       PROMPT,
              'image_url':    image_url,
              'duration':     DURATION,
              'aspect_ratio': ASPECT,
              'num_inference_steps': 30,
              'enable_safety_checker': False
          }

          sub = requests.post(
              f'https://queue.fal.run/{ENDPOINT}',
              headers=FAL_HEADERS,
              json=payload,
              timeout=30
          )
          if sub.status_code not in (200, 201):
              print(f'Submit {sub.status_code}: {sub.text[:300]}')
              raise SystemExit('Soumission job échouée')

          req_id = sub.json().get('request_id')
          if not req_id:
              print('Réponse sync:', json.dumps(sub.json(), indent=2)[:300])
              # Réponse synchrone directe
              video_url = sub.json().get('video', {}).get('url')
              if video_url:
                  print(f'✓ Vidéo (sync): {video_url}')
              else:
                  raise SystemExit('request_id et video_url absents')
          else:
              print(f'✓ Job soumis — request_id: {req_id}')

              # ── 3. Poll statut ─────────────────────────────────────────
              print('⏳ Attente génération...')
              video_url = None
              max_wait, interval, elapsed = 900, 10, 0

              while elapsed < max_wait:
                  time.sleep(interval)
                  elapsed += interval

                  st = requests.get(
                      f'https://queue.fal.run/{ENDPOINT}/requests/{req_id}/status',
                      headers=FAL_HEADERS, timeout=15
                  )
                  if st.status_code != 200:
                      print(f'[{elapsed}s] status {st.status_code}')
                      continue

                  status = st.json().get('status', '?')
                  print(f'[{elapsed}s] {status}')

                  if status == 'COMPLETED':
                      res = requests.get(
                          f'https://queue.fal.run/{ENDPOINT}/requests/{req_id}',
                          headers=FAL_HEADERS, timeout=15
                      )
                      video_url = res.json().get('video', {}).get('url')
                      break
                  elif status in ('FAILED', 'ERROR'):
                      print('Détail:', json.dumps(st.json(), indent=2)[:400])
                      raise SystemExit(f'Job fal.ai échoué: {status}')
              else:
                  raise SystemExit('Timeout > 15 min')

          if not video_url:
              raise SystemExit('video_url introuvable dans la réponse')

          print(f'✓ Vidéo générée: {video_url}')

          # ── 4. Télécharger le MP4 ────────────────────────────────────────
          print('📥 Téléchargement MP4...')
          vr = requests.get(video_url, timeout=120, stream=True)
          vr.raise_for_status()
          out = '/tmp/output.mp4'
          with open(out, 'wb') as f:
              for chunk in vr.iter_content(8192):
                  f.write(chunk)
          size_mb = os.path.getsize(out) / 1048576
          print(f'✓ MP4: {size_mb:.1f} MB')

          # ── 5. Publier GitHub Release ────────────────────────────────────
          TAG  = f'viravid-{RUN_ID}'
          NAME = f'lescrados-{RUN_ID}.mp4'
          print(f'📦 GitHub Release {TAG}...')

          rel = requests.post(
              f'https://api.github.com/repos/{GH_REPO}/releases',
              headers=GH_HEADERS,
              json={
                  'tag_name':   TAG,
                  'name':       f'ViraCut {RUN_ID}',
                  'body':       f'Prompt: {PROMPT}\nAspect: {ASPECT} | Duration: {DURATION}s',
                  'draft':      False,
                  'prerelease': True
              },
              timeout=15
          )
          rel.raise_for_status()
          upload_url = rel.json()['upload_url'].replace('{?name,label}', '')

          with open(out, 'rb') as f:
              up = requests.post(
                  upload_url,
                  headers={**GH_HEADERS, 'Content-Type': 'video/mp4'},
                  params={'name': NAME},
                  data=f, timeout=120
              )
          up.raise_for_status()

          dl_url = up.json()['browser_download_url']
          print(f'✓ Release: {dl_url}')

          # Summary pour l'app HTML
          summary = os.environ.get('GITHUB_STEP_SUMMARY', '/dev/null')
          with open(summary, 'a') as f:
              f.write(f'## ✅ Vidéo\n**URL:** {dl_url}\n**Tag:** `{TAG}`\n')

          with open('/tmp/video_url.txt', 'w') as f:
              f.write(dl_url)
          PYEOF

      - name: Upload video URL artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-url
          path: /tmp/video_url.txt
          retention-days: 1
          if-no-files-found: warn
