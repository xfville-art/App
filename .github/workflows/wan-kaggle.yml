name: Wan2.1 Image-to-Video (Kaggle GPU)

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Prompt de génération vidéo'
        required: true
        type: string
      image_base64:
        description: 'Image source base64 compressée'
        required: true
        type: string
      duration:
        required: false
        default: '5'
        type: string
      aspect_ratio:
        required: false
        default: '9:16'
        type: string

jobs:
  launch-kaggle:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Kaggle 1.5.16 (avant migration gRPC)
        # Les versions >= 1.6.0 ont migré kernels_push vers gRPC SaveKernel
        # qui retourne 401 avec les tokens API depuis l'extérieur.
        # 1.5.16 utilise encore l'ancienne API REST /kernels/push qui fonctionne.
        run: pip install "kaggle==1.5.16" requests

      - name: Push & run kernel
        env:
          KAGGLE_USERNAME:    ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY:         ${{ secrets.KAGGLE_KEY }}
          KAGGLE_KERNEL_SLUG: ${{ secrets.KAGGLE_KERNEL_SLUG }}
          GH_TOKEN:           ${{ secrets.GITHUB_TOKEN }}
          GH_REPO:            ${{ github.repository }}
          PROMPT:             ${{ inputs.prompt }}
          IMAGE_BASE64:       ${{ inputs.image_base64 }}
          DURATION:           ${{ inputs.duration }}
          ASPECT_RATIO:       ${{ inputs.aspect_ratio }}
        run: |
          python3 - << 'PYEOF'
          import os, json, time, tempfile, shutil
          from kaggle.api.kaggle_api_extended import KaggleApi

          api = KaggleApi()
          api.authenticate()
          print("✓ Auth Kaggle OK (kaggle 1.5.16)")

          KG_USER      = os.environ['KAGGLE_USERNAME']
          KERNEL_SLUG  = os.environ.get('KAGGLE_KERNEL_SLUG', 'viravid-i2v')
          GH_TOKEN     = os.environ['GH_TOKEN']
          GH_REPO      = os.environ['GH_REPO']
          PROMPT       = os.environ['PROMPT']
          IMG_B64      = os.environ['IMAGE_BASE64']
          DURATION     = os.environ.get('DURATION', '5')
          RATIO        = os.environ.get('ASPECT_RATIO', '9:16')
          RUN_ID       = str(int(time.time()))
          KERNEL_TITLE = KERNEL_SLUG.replace('-', ' ')

          # Lire le notebook template
          with open('.github/workflows/wan-i2v.ipynb') as f:
              nb = json.load(f)

          # Injecter les paramètres en première cellule
          nb['cells'].insert(0, {
              "cell_type": "code",
              "execution_count": None,
              "metadata": {},
              "outputs": [],
              "source": [
                  "import os\n",
                  f"os.environ['PROMPT']       = {json.dumps(PROMPT)}\n",
                  f"os.environ['IMAGE_BASE64'] = {json.dumps(IMG_B64)}\n",
                  f"os.environ['DURATION']     = {json.dumps(DURATION)}\n",
                  f"os.environ['ASPECT_RATIO'] = {json.dumps(RATIO)}\n",
                  f"os.environ['GH_TOKEN']     = {json.dumps(GH_TOKEN)}\n",
                  f"os.environ['GH_REPO']      = {json.dumps(GH_REPO)}\n",
                  f"os.environ['RUN_ID']       = {json.dumps(RUN_ID)}\n",
                  "print('Params OK')\n"
              ]
          })

          tmpdir = tempfile.mkdtemp()
          nb_file = os.path.join(tmpdir, f'{KERNEL_SLUG}.ipynb')
          with open(nb_file, 'w') as f:
              json.dump(nb, f)

          with open(os.path.join(tmpdir, 'kernel-metadata.json'), 'w') as f:
              json.dump({
                  "id":              f"{KG_USER}/{KERNEL_SLUG}",
                  "title":           KERNEL_TITLE,
                  "code_file":       f"{KERNEL_SLUG}.ipynb",
                  "language":        "python",
                  "kernel_type":     "notebook",
                  "is_private":      True,
                  "enable_gpu":      True,
                  "enable_tpu":      False,
                  "enable_internet": True,
                  "dataset_sources":     [],
                  "competition_sources": [],
                  "kernel_sources":      []
              }, f)

          print(f'Pushing {KG_USER}/{KERNEL_SLUG}...')
          api.kernels_push(tmpdir)
          shutil.rmtree(tmpdir)
          print(f'✓ Kernel lancé — RUN_ID={RUN_ID}')

          with open('/tmp/run_id.txt', 'w') as f:
              f.write(RUN_ID)
          PYEOF

      - name: Poll kernel + attendre Release GitHub
        env:
          KAGGLE_USERNAME:    ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY:         ${{ secrets.KAGGLE_KEY }}
          KAGGLE_KERNEL_SLUG: ${{ secrets.KAGGLE_KERNEL_SLUG }}
          GH_TOKEN:           ${{ secrets.GITHUB_TOKEN }}
          GH_REPO:            ${{ github.repository }}
        run: |
          python3 - << 'PYEOF'
          import os, requests, time
          from kaggle.api.kaggle_api_extended import KaggleApi

          api = KaggleApi()
          api.authenticate()

          KG_USER     = os.environ['KAGGLE_USERNAME']
          KERNEL_SLUG = os.environ.get('KAGGLE_KERNEL_SLUG', 'viravid-i2v')
          GH_TOKEN    = os.environ['GH_TOKEN']
          GH_REPO     = os.environ['GH_REPO']
          GH_HEADERS  = {
              'Authorization': f'token {GH_TOKEN}',
              'Accept': 'application/vnd.github.v3+json'
          }

          with open('/tmp/run_id.txt') as f:
              RUN_ID = f.read().strip()

          TAG = f'viravid-{RUN_ID}'
          print(f'Poll {KG_USER}/{KERNEL_SLUG} → Release {TAG}')
          max_wait, interval, elapsed = 1200, 20, 0

          while elapsed < max_wait:
              time.sleep(interval)
              elapsed += interval

              # Statut kernel (API REST dans v1.5.16)
              try:
                  st = api.kernels_status(f'{KG_USER}/{KERNEL_SLUG}')
                  kstatus = st.get('status', '?') if isinstance(st, dict) else str(getattr(st, 'status', st))
                  print(f'[{elapsed}s] Kaggle: {kstatus}')
                  if str(kstatus).lower() in ('error', 'cancelacknowledged', 'cancelled'):
                      raise SystemExit(f'Kernel en erreur: {kstatus}')
              except SystemExit:
                  raise
              except Exception as e:
                  print(f'[{elapsed}s] status: {e}')

              # Chercher la Release GitHub
              rel_r = requests.get(
                  f'https://api.github.com/repos/{GH_REPO}/releases/tags/{TAG}',
                  headers=GH_HEADERS, timeout=10)
              if rel_r.status_code == 200:
                  assets = rel_r.json().get('assets', [])
                  if assets:
                      dl_url = assets[0]['browser_download_url']
                      print(f'✓ Vidéo: {dl_url}')
                      with open('/tmp/video_url.txt', 'w') as f:
                          f.write(dl_url)
                      summary = os.environ.get('GITHUB_STEP_SUMMARY', '/dev/null')
                      with open(summary, 'a') as f:
                          f.write(f'## ✅ Vidéo\n**URL:** {dl_url}\n**Tag:** `{TAG}`\n')
                      break
              else:
                  print(f'  Release {rel_r.status_code}')
          else:
              raise SystemExit('Timeout > 20 min')
          PYEOF

      - name: Upload video URL
        uses: actions/upload-artifact@v4
        with:
          name: video-url
          path: /tmp/video_url.txt
          retention-days: 1
          if-no-files-found: warn
