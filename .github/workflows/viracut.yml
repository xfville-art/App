name: VIRACUT

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg + fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            fonts-liberation \
            fonts-dejavu-core \
            fontconfig
          fc-cache -f -v 2>/dev/null | tail -1
          echo "FFmpeg  : $(ffmpeg -version 2>&1 | head -1)"
          echo "Python  : $(python3 --version)"
          echo "Font    : $(fc-list | grep -i liberation | head -1)"

      - name: Validate p.json
        run: |
          [ -f p.json ] || { echo "❌ p.json manquant"; exit 1; }
          python3 - << 'PYEOF'
          import json, sys, base64

          with open('p.json') as f:
              d = json.load(f)

          clips = d.get('videos', [])
          opts  = d.get('options', {})

          if not clips:
              print("❌ Aucun clip dans p.json")
              sys.exit(1)

          print(f"✓ {len(clips)} clip(s) reçu(s)")
          total_size = sum(len(v.get('data','')) * 3 // 4 for v in clips)
          print(f"  Taille totale estimée : {total_size // 1048576} MB")

          for i, v in enumerate(clips):
              role = v.get('role', 'auto')
              size = len(v.get('data','')) * 3 // 4
              print(f"  Clip {i}: rôle={role}  ~{size//1024}KB")

          print(f"\nOptions actives :")
          keys = [
              ('resolution','720x1280'), ('fps',24), ('crf',18),
              ('ai_text',True), ('auto_order',True),
              ('zoom_punch',True), ('zoom_scale',1.08),
              ('flash_cut',True), ('text_bg',False),
              ('hook_dur',2.0), ('core_dur',2.5), ('punch_dur',3.0),
              ('tolerance',0.7), ('scdet_thr',10),
              ('audio_br',192), ('fade_dur',0.3),
              ('hook_size',86), ('punch_size',62),
          ]
          for k, default in keys:
              v = opts.get(k, default)
              marker = '' if v == default else ' ← custom'
              print(f"  {k:<15} : {v}{marker}")

          ch = opts.get('custom_hook','')
          cp = opts.get('custom_punch','')
          if ch:  print(f"  custom_hook    : \"{ch}\"")
          if cp:  print(f"  custom_punch   : \"{cp}\"")
          PYEOF

      - name: Run render
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "════════════════════════════════════"
          echo "  ViraCut render start"
          echo "════════════════════════════════════"
          python3 render.py
          echo "════════════════════════════════════"
          echo "  render.py terminé"
          echo "════════════════════════════════════"

      - name: Verify output
        run: |
          [ -f output.mp4 ] || { echo "❌ output.mp4 absent"; exit 1; }
          python3 - << 'PYEOF'
          import json, subprocess, sys

          r = subprocess.run(
              ['ffprobe','-v','quiet','-print_format','json',
               '-show_format','-show_streams','output.mp4'],
              capture_output=True, text=True)
          d = json.loads(r.stdout)

          dur   = float(d['format']['duration'])
          size  = int(d['format']['size'])
          streams = d.get('streams', [])

          w = next((s['width']  for s in streams if s.get('codec_type')=='video'), '?')
          h = next((s['height'] for s in streams if s.get('codec_type')=='video'), '?')
          vcodec = next((s.get('codec_name') for s in streams if s.get('codec_type')=='video'), '?')
          acodec = next((s.get('codec_name') for s in streams if s.get('codec_type')=='audio'), None)
          fps_raw = next((s.get('r_frame_rate','') for s in streams if s.get('codec_type')=='video'), '')

          try:
              num, den = fps_raw.split('/')
              fps = round(int(num) / int(den), 1)
          except:
              fps = '?'

          print(f"✅ output.mp4 valide")
          print(f"   Résolution : {w}×{h}")
          print(f"   Durée      : {dur:.2f}s")
          print(f"   Taille     : {size//1024}KB")
          print(f"   Vidéo      : {vcodec} @ {fps}fps")
          print(f"   Audio      : {acodec if acodec else 'absent'}")

          errors = []
          if dur < 1.0:
              errors.append(f"Durée trop courte ({dur:.2f}s)")
          if size < 50000:
              errors.append(f"Fichier trop petit ({size}B)")
          if str(h) not in ('1280','1920','960'):
              errors.append(f"Hauteur inattendue ({h}px)")

          if errors:
              for e in errors:
                  print(f"⚠ {e}")
              sys.exit(1)
          PYEOF

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: viracut-output
          path: output.mp4
          retention-days: 7
          if-no-files-found: error
