name: VIRACUT

on:
  workflow_dispatch:

# Autorise le workflow à modifier le dépôt (nécessaire pour p.json et les artefacts)
permissions:
  contents: write
  actions: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Récupération du code source
        uses: actions/checkout@v4

      - name: 2. Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. Installation FFmpeg, FFprobe et Polices (Vital pour le texte IA)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: 4. Vérification du fichier de données
        run: |
          if [ -f p.json ]; then
            echo "p.json trouvé. Lancement du rendu IA..."
          else
            echo "ERREUR : p.json est absent. Vérifiez l'envoi depuis l'App."
            exit 1
          fi

      - name: 5. Exécution du Rendu IA (Captions Anthropic)
        # Utilise le token automatique de GitHub pour l'identification
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python render.py

      - name: 6. Publication de la Vidéo Finale
        uses: actions/upload-artifact@v4
        with:
          name: video-finale
          path: output.mp4
          if-no-files-found: error
          retention-days: 7
          
