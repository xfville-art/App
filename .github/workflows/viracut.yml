name: VIRACUT

on:
  push:
    branches: [main]
    paths:
      - "p.json"
      - "*.json"
      - "!package*.json"
      - "!*.lock.json"

  workflow_dispatch:

concurrency:
  group: viracut-render
  cancel-in-progress: true

jobs:
  render:
    name: render
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # cache: pip retiré — plante si requirements.txt absent

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            fonts-liberation
          ffmpeg -version | head -1

      - name: Check payload JSON
        run: |
          if [ ! -f p.json ]; then
            echo "::warning::p.json absent — render.py cherchera un *.json alternatif"
          else
            echo "p.json trouvé ($(wc -c < p.json) octets)"
          fi

      - name: Run render.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 render.py

      - name: Upload output video
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: viracut-output
          path: output.mp4
          retention-days: 7
          if-no-files-found: warn

      - name: Cleanup temp files
        if: always()
        run: |
          rm -f _raw_*.mp4 _cin_*.mp4 _assembled.mp4 _premain.mp4 \
                _logo.mp4 _presub.mp4 _concat*.txt _sub_*.txt \
                p.json pa.json 2>/dev/null || true
