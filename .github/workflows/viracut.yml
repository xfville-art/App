name: VIRACUT

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2   # Node 24 natif — supprime l'avertissement

      - name: Install Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-liberation

      - name: Execution Python
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 render.py

      - name: Sauvegarde Video
        if: always()
        uses: actions/upload-artifact@v4.6.0   # Node 24 natif — supprime l'avertissement
        with:
          name: MaVideo
          path: output.mp4
