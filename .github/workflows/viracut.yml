name: VIRACUT

on:
  workflow_dispatch:

permissions:
  contents: read
  models: read      # GitHub Models API — requis pour l'analyse viralité

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Install Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-liberation
          pip3 install Pillow --break-system-packages -q

      - name: Execution Python
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python3 render.py

      - name: Sauvegarde Video
        if: always()
        uses: actions/upload-artifact@v4.6.0
        with:
          name: viracut-output
          path: output.mp4
