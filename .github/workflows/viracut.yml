name: VIRACUT

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-liberation

      - name: Execution Python
        run: |
          python3 render.py

      - name: Sauvegarde Video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MaVideo
          path: output.mp4
