name: VIRACUT

on:
  push:
    branches: [main]
    paths:
      - "p.json"
      - "*.json"
      - "!package*.json"
      - "!*.lock.json"

  workflow_dispatch:

concurrency:
  group: viracut-render
  cancel-in-progress: true

jobs:
  render:
    name: render
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            fonts-liberation
          ffmpeg -version | head -1

      - name: Check payload JSON
        run: |
          if [ ! -f p.json ]; then
            echo "::warning::p.json absent"
          else
            echo "p.json trouvé ($(wc -c < p.json) octets)"
          fi

      - name: Run render.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 render.py

      # ── Commit output.mp4 dans le repo pour téléchargement direct ──
      # L'upload-artifact donne un .zip/.tar selon le navigateur.
      # On commit plutôt output.mp4 dans le dossier results/ du repo :
      # → lien direct GitHub raw = vrai MP4 téléchargeable depuis l'app.
      - name: Commit output.mp4 to repo
        if: success()
        run: |
          git config user.name  "ViraCut Bot"
          git config user.email "viracut@lescrados.ai"
          mkdir -p results
          # Nommer avec le run number pour ne pas écraser
          OUT="results/output_run${{ github.run_number }}.mp4"
          cp output.mp4 "$OUT"
          # Garder aussi output.mp4 racine pour compatibilité app
          cp output.mp4 output_latest.mp4
          git add "$OUT" output_latest.mp4
          git commit -m "ViraCut output — run #${{ github.run_number }} [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Artifact de secours (zip) ───────────────────────────────────
      - name: Upload artifact (backup)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: viracut-output
          path: output.mp4
          retention-days: 7
          if-no-files-found: warn
          compression-level: 0

      - name: Cleanup temp files
        if: always()
        run: |
          rm -f _raw_*.mp4 _cin_*.mp4 _assembled.mp4 _premain.mp4 \
                _logo.mp4 _presub.mp4 _output_fade.mp4 _concat*.txt \
                _sub_*.txt p.json pa.json 2>/dev/null || true
