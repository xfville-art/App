name: VIRACUT

on:
  push:
    branches: [main]
    paths:
      - "p.json"
      - "*.json"
      - "!package*.json"
      - "!*.lock.json"

  workflow_dispatch:

concurrency:
  group: viracut-render
  cancel-in-progress: true

jobs:
  render:
    name: render
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            fonts-liberation
          ffmpeg -version | head -1

      - name: Check payload JSON
        run: |
          if [ ! -f p.json ]; then
            echo "::warning::p.json absent — render.py cherchera un *.json alternatif"
          else
            echo "p.json trouvé ($(wc -c < p.json) octets)"
          fi

      - name: Run render.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 render.py

      # ── Préparer le MP4 dans un dossier dédié pour l'artifact ──────
      # upload-artifact@v4 sur Linux zippe en .tar par défaut.
      # En isolant output.mp4 seul dans ./artifact/, le téléchargement
      # donne un zip contenant uniquement output.mp4 — extractable directement.
      - name: Prepare artifact folder
        if: always()
        run: |
          mkdir -p artifact
          if [ -f output.mp4 ]; then
            cp output.mp4 artifact/output.mp4
            echo "output.mp4 prêt ($(du -sh artifact/output.mp4 | cut -f1))"
          else
            echo "::warning::output.mp4 absent — rendu probablement échoué"
          fi

      - name: Upload output video
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: viracut-output
          path: artifact/output.mp4   # fichier seul = zip minimal
          retention-days: 7
          if-no-files-found: warn
          compression-level: 0        # MP4 déjà compressé — pas de re-compression

      - name: Cleanup temp files
        if: always()
        run: |
          rm -f _raw_*.mp4 _cin_*.mp4 _assembled.mp4 _premain.mp4 \
                _logo.mp4 _presub.mp4 _output_fade.mp4 _concat*.txt \
                _sub_*.txt p.json pa.json 2>/dev/null || true
