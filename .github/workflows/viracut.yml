name: VIRACUT

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4 # Version compatible Node 24

      - name: Install FFmpeg + fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            fonts-liberation \
            fontconfig
          fc-cache -f -v
          
      # ... (conservez vos étapes de validation et de rendu inchangées)
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4 # Version compatible Node 24
        with:
          name: viracut-output
          path: output.mp4
