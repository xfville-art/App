<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ViraCut · LesCrados.Ai · v9</title>
<style>
/* Google Fonts — chargement non-bloquant, fallback système si content:// */

:root{
  --bg:#0a0a0f;
  --bg2:#111118;
  --bg3:#18181f;
  --bg4:#1e1e28;
  --sep:rgba(255,255,255,.06);
  --sep2:rgba(255,255,255,.04);
  --t1:#f0f0f8;
  --t2:#9090b0;
  --t3:#555570;
  --red:#ff3b5c;
  --red2:rgba(255,59,92,.12);
  --orange:#ff8c42;
  --green:#34d399;
  --green2:rgba(52,211,153,.12);
  --blue:#6c63ff;
  --blue2:rgba(108,99,255,.15);
  --cyan:#00d4ff;
  --gold:#f5c842;
  --r:18px;
  --r2:12px;
  --r3:8px;
  --sh:0 2px 20px rgba(0,0,0,.5);
  --sh2:0 1px 6px rgba(0,0,0,.3);
  --fn:'DM Sans','SF Pro Text','Segoe UI',system-ui,sans-serif;
  --fh:'Syne','SF Pro Display','Segoe UI',system-ui,sans-serif;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--t1);font-family:var(--fn);overflow:hidden}

/* ─── APP SHELL ─── */
#app{display:flex;flex-direction:column;height:100%;height:100vh;max-width:430px;margin:0 auto;position:relative}
@supports (height:100dvh){#app{height:100dvh}}

/* ─── HEADER ─── */
.hdr{
  padding:calc(var(--safe-top) + 14px) 20px 12px;
  background:rgba(10,10,15,.9);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  border-bottom:1px solid var(--sep);
  display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;
  position:relative;z-index:50;
}
.hdr-logo{
  display:flex;align-items:center;gap:10px;
}
.hdr-mark{
  width:34px;height:34px;border-radius:9px;
  background:linear-gradient(135deg,#ff3b5c,#6c63ff);
  display:flex;align-items:center;justify-content:center;
  font-size:17px;flex-shrink:0;
  box-shadow:0 4px 16px rgba(255,59,92,.35);
}
.hdr-wordmark{font-family:var(--fh);font-size:17px;font-weight:800;letter-spacing:-.3px}
.hdr-wordmark span{color:var(--red)}
.hdr-right{display:flex;align-items:center;gap:8px}
.pill{
  display:flex;align-items:center;gap:5px;
  padding:5px 10px;border-radius:20px;
  background:var(--bg3);border:1px solid var(--sep);
  font-size:11px;font-weight:600;color:var(--t3);letter-spacing:.3px;
}
.pill.ok{background:var(--green2);border-color:rgba(52,211,153,.25);color:var(--green)}
.pill-dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok .pill-dot{animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.hdr-btn{
  width:32px;height:32px;border-radius:8px;
  border:1px solid var(--sep);background:var(--bg3);
  color:var(--t2);font-size:14px;cursor:pointer;
  display:none;align-items:center;justify-content:center;
}

/* ─── SETUP SCREEN ─── */
#viewSetup{
  flex:1;overflow-y:auto;
  padding:32px 20px calc(var(--safe-bot)+24px);
}
.setup-hero{text-align:center;margin-bottom:36px;padding-top:20px}
.setup-hero-logo{
  width:80px;height:80px;border-radius:22px;
  background:linear-gradient(135deg,#ff3b5c,#6c63ff);
  display:inline-flex;align-items:center;justify-content:center;
  font-size:40px;margin-bottom:16px;
  box-shadow:0 8px 32px rgba(255,59,92,.4);
}
.setup-hero h1{font-family:var(--fh);font-size:26px;font-weight:800;letter-spacing:-.5px;margin-bottom:6px}
.setup-hero h1 span{color:var(--red)}
.setup-hero p{color:var(--t2);font-size:14px;line-height:1.6}
.setup-card{
  background:var(--bg2);border-radius:var(--r);
  border:1px solid var(--sep);overflow:hidden;margin-bottom:12px;
}
.setup-field{padding:14px 18px;border-bottom:1px solid var(--sep2)}
.setup-field:last-child{border-bottom:none}
.setup-field label{display:block;font-size:11px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.setup-field input{
  width:100%;background:transparent;border:none;outline:none;
  font-family:var(--fn);font-size:15px;color:var(--t1);font-weight:500;
  padding:0;
}
.setup-field input::placeholder{color:var(--t3)}
.btn-login{
  width:100%;padding:16px;border:none;border-radius:var(--r);
  font-family:var(--fh);font-size:16px;font-weight:800;letter-spacing:.3px;
  cursor:pointer;margin-top:16px;
  background:linear-gradient(135deg,#ff3b5c 0%,#6c63ff 100%);
  color:#fff;
  box-shadow:0 6px 24px rgba(255,59,92,.4);
  transition:all .2s;
}
.btn-login:active{transform:scale(.97);opacity:.9}

/* ─── STUDIO ─── */
#viewStudio{display:none;flex-direction:column;flex:1;overflow:hidden}

/* ─── TABS ─── */
.tabs{
  display:grid;grid-template-columns:repeat(4,1fr);
  background:rgba(10,10,15,.95);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  border-bottom:1px solid var(--sep);
  flex-shrink:0;
}
.tab{
  padding:10px 4px 12px;text-align:center;
  font-size:10px;font-weight:600;letter-spacing:.4px;
  text-transform:uppercase;color:var(--t3);
  cursor:pointer;transition:color .15s;position:relative;user-select:none;
}
.tab.active{color:var(--t1)}
.tab-bar{
  position:absolute;bottom:0;left:12px;right:12px;height:2px;
  background:linear-gradient(90deg,var(--red),var(--blue));
  border-radius:2px 2px 0 0;
  transform:scaleX(0);transition:transform .25s cubic-bezier(.34,1.56,.64,1);
}
.tab.active .tab-bar{transform:scaleX(1)}
.tab-icon{font-size:17px;display:block;margin-bottom:3px}
.tab-dot{
  position:absolute;top:8px;right:10px;
  width:7px;height:7px;border-radius:50%;
  background:var(--red);border:1.5px solid var(--bg);
  display:none;
}
.tab-dot.show{display:block;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ─── SCROLL AREA ─── */
.tab-pane{display:none;overflow-y:auto;flex:1;padding:16px 16px calc(var(--safe-bot)+16px)}
.tab-pane.active{display:block}

/* ─── CARDS ─── */
.card{
  background:var(--bg2);border-radius:var(--r);
  border:1px solid var(--sep);margin-bottom:12px;overflow:hidden;
}
.card-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px 12px;
}
.card-title{font-size:11px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.5px}
.card-action{font-size:13px;font-weight:600;color:var(--blue);cursor:pointer}

/* ─── MODE SELECTOR ─── */
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 14px 14px}
.mode-btn{
  padding:12px 8px 10px;border-radius:12px;
  background:var(--bg3);border:1.5px solid var(--sep);
  text-align:center;cursor:pointer;
  transition:all .2s;user-select:none;
}
.mode-icon{font-size:22px;display:block;margin-bottom:5px}
.mode-name{font-family:var(--fh);font-size:13px;font-weight:800;display:block;letter-spacing:.2px;color:var(--t2);transition:color .2s}
.mode-desc{font-size:10px;color:var(--t3);display:block;margin-top:2px;line-height:1.3}
.mode-btn.active-punch{background:rgba(255,59,92,.08);border-color:var(--red)}
.mode-btn.active-punch .mode-name{color:var(--red)}
.mode-btn.active-cinema{background:rgba(108,99,255,.10);border-color:var(--blue)}
.mode-btn.active-cinema .mode-name{color:var(--blue)}
.mode-btn.active-auto{background:rgba(245,200,66,.08);border-color:var(--gold)}
.mode-btn.active-auto .mode-name{color:var(--gold)}
.mode-hint{font-size:12px;color:var(--t2);padding:0 14px 14px;line-height:1.5}

/* ─── STATS ─── */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{
  background:var(--bg2);border-radius:14px;border:1px solid var(--sep);
  padding:14px 12px 12px;text-align:center;
}
.stat-v{font-family:var(--fh);font-size:22px;font-weight:800;letter-spacing:-.5px;display:block}
.stat-v.g{color:var(--green)}
.stat-v.r{color:var(--red)}
.stat-v.b{color:var(--cyan)}
.stat-l{font-size:10px;color:var(--t3);font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-top:2px}

/* ─── PROGRESS ─── */
.prog-wrap{padding:16px 16px 0}
.prog-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px}
.prog-title{font-family:var(--fh);font-size:15px;font-weight:800;letter-spacing:-.2px}
.prog-pct{font-size:13px;font-weight:700;color:var(--t2)}
.prog-sub{font-size:12px;color:var(--t2);margin-bottom:10px;font-weight:500}
.prog-timer{font-size:11px;color:var(--t3);margin-bottom:10px;font-weight:600;letter-spacing:.3px}
.prog-track{
  height:6px;border-radius:6px;background:var(--bg4);
  overflow:hidden;margin-bottom:14px;position:relative;
}
.prog-fill{
  height:100%;border-radius:6px;
  background:linear-gradient(90deg,var(--red),var(--blue));
  transition:width .6s cubic-bezier(.16,1,.3,1);width:0%;
  position:relative;
}
.prog-fill.run::after{
  content:'';position:absolute;right:0;top:0;bottom:0;width:40px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.4));
  animation:shimmer-r .8s infinite;
}
@keyframes shimmer-r{0%{opacity:0}50%{opacity:1}100%{opacity:0}}
.prog-fill.done{background:linear-gradient(90deg,var(--green),var(--cyan))}
.logs-link{font-size:12px;font-weight:600;color:var(--blue);text-decoration:none;display:none}
.logs-link:hover{opacity:.7}

/* ─── STEPS ─── */
.steps{padding:0 16px 14px}
.step{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--sep2)}
.step:last-child{border-bottom:none}
.step-n{
  width:22px;height:22px;border-radius:50%;
  border:1.5px solid var(--t3);
  display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;color:var(--t3);flex-shrink:0;
  transition:all .2s;
}
.step.run .step-n{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 2px 8px rgba(108,99,255,.5)}
.step.done .step-n{background:var(--green);border-color:var(--green);color:#fff}
.step-lbl{flex:1;font-size:13px;color:var(--t3);font-weight:500;transition:color .2s}
.step.run .step-lbl{color:var(--t1);font-weight:600}
.step.done .step-lbl{color:var(--t2)}
.step-note{font-size:12px;color:var(--t3);font-weight:600}
.step.run .step-note{color:var(--blue)}
.step.done .step-note{color:var(--green)}

/* ─── CHIPS ─── */
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:12px 14px}
.chip{
  padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;
  letter-spacing:.2px;
}
.chip.info{background:var(--blue2);color:#a0a8ff}
.chip.on{background:rgba(52,211,153,.12);color:var(--green)}
.chip.off{background:var(--bg3);color:var(--t3)}
.chip.warn{background:rgba(245,200,66,.12);color:var(--gold)}
.chip.cinema{background:rgba(108,99,255,.12);color:#a0a8ff}

/* ─── LAUNCH BUTTON ─── */
.btn-launch{
  width:100%;padding:17px;border:none;border-radius:var(--r);
  font-family:var(--fh);font-size:16px;font-weight:800;letter-spacing:.5px;
  cursor:pointer;margin-top:4px;
  background:linear-gradient(135deg,var(--red) 0%,var(--blue) 100%);
  color:#fff;box-shadow:0 6px 24px rgba(255,59,92,.35);
  transition:all .2s;
}
.btn-launch:active{transform:scale(.97)}
.btn-launch:disabled{background:var(--bg4);color:var(--t3);box-shadow:none;cursor:not-allowed;transform:none}

/* ─── GENERIC BUTTONS ─── */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;padding:14px 20px;border:none;border-radius:var(--r2);
  font-family:var(--fn);font-size:15px;font-weight:600;cursor:pointer;
  transition:all .15s;
}
.btn:active{transform:scale(.97);opacity:.88}
.btn-ghost{background:var(--bg3);color:var(--t2);border:1px solid var(--sep)}
.btn-green{background:rgba(52,211,153,.15);color:var(--green);border:1px solid rgba(52,211,153,.25)}
.btn-sec{background:var(--bg3);color:var(--t2);border:1px solid var(--sep);font-size:14px}

/* ─── RESULT ─── */
.result{background:var(--bg2);border-radius:var(--r);border:1px solid rgba(52,211,153,.2);margin-top:12px;overflow:hidden}
.result-head{display:flex;align-items:center;gap:12px;padding:16px}
.result-icon{font-size:28px}
.result-title{font-family:var(--fh);font-size:16px;font-weight:800}
.result-sub{font-size:12px;color:var(--t2);margin-top:2px}
.result-body{padding:0 16px 16px;display:flex;flex-direction:column;gap:8px}

/* ─── CLIPS / FILE LIST ─── */
.drop-zone{
  border:1.5px dashed var(--sep);border-radius:var(--r2);
  padding:28px 20px;text-align:center;cursor:pointer;
  transition:all .2s;background:var(--bg3);
  margin:0 14px 14px;
}
.drop-zone.over,.drop-zone:active{border-color:var(--blue);background:var(--blue2)}
.drop-zone.has-files{border-color:var(--green);background:var(--green2);padding:16px 20px}
.drop-icon{font-size:36px;margin-bottom:8px;display:block}
.drop-title{font-family:var(--fh);font-size:16px;font-weight:800;margin-bottom:4px}
.drop-hint{font-size:12px;color:var(--t2)}
.drop-added{font-size:12px;font-weight:700;color:var(--green);letter-spacing:.5px;text-transform:uppercase}

/* ─── CLIP THUMBNAILS ─── */
.clips-grid{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.clip-card{
  background:var(--bg3);border-radius:14px;border:1px solid var(--sep);
  display:flex;align-items:center;gap:12px;padding:10px 12px;
  cursor:grab;transition:all .2s;position:relative;overflow:hidden;
}
.clip-card.drag-over{border-color:var(--blue);background:var(--blue2)}
.clip-card.dragging{opacity:.4}
.clip-thumb{
  width:54px;height:72px;border-radius:8px;
  background:var(--bg4);flex-shrink:0;overflow:hidden;
  position:relative;
}
.clip-thumb canvas{width:100%;height:100%;object-fit:cover;display:block}
.clip-thumb-placeholder{
  width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-size:20px;
}
.clip-thumb-dur{
  position:absolute;bottom:3px;right:3px;
  background:rgba(0,0,0,.75);color:#fff;
  font-size:9px;font-weight:700;padding:2px 4px;border-radius:3px;
}
.clip-info{flex:1;min-width:0}
.clip-name{font-size:13px;font-weight:600;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}
.clip-meta{font-size:11px;color:var(--t3);font-weight:500}
.clip-role-badge{
  padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;
  letter-spacing:.3px;cursor:pointer;flex-shrink:0;transition:all .15s;
  user-select:none;
}
.clip-role-badge.auto{background:rgba(245,200,66,.12);color:var(--gold)}
.clip-role-badge.hook{background:rgba(255,59,92,.12);color:var(--red)}
.clip-role-badge.core{background:rgba(0,212,255,.1);color:var(--cyan)}
.clip-role-badge.punch{background:rgba(108,99,255,.12);color:var(--blue)}
.clip-del{
  width:26px;height:26px;border-radius:50%;
  background:var(--red2);border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;color:var(--red);flex-shrink:0;
  transition:all .15s;
}
.clip-del:hover{background:var(--red);color:#fff}
.clip-drag-handle{color:var(--t3);font-size:14px;cursor:grab;flex-shrink:0;padding:4px}

/* ─── ORDER HINT ─── */
.order-hint{font-size:12px;color:var(--t2);padding:0 14px 10px;font-weight:500;line-height:1.5}

/* ─── VIRALITE ─── */
.vira-card{
  background:var(--bg2);border-radius:var(--r);
  border:1.5px solid var(--sep);margin-bottom:12px;overflow:hidden;
  transition:border-color .3s;
}
.vira-card.has-score{border-color:rgba(52,211,153,.25)}
.vira-head{
  display:flex;align-items:center;gap:12px;padding:14px 16px;
  border-bottom:1px solid var(--sep2);
}
.vira-head-icon{font-size:22px}
.vira-head-title{font-family:var(--fh);font-size:15px;font-weight:800}
.vira-head-sub{font-size:11px;color:var(--t2);margin-top:1px}
.btn-analyze{
  margin-left:auto;padding:8px 14px;border:none;border-radius:20px;
  font-family:var(--fn);font-size:12px;font-weight:700;cursor:pointer;
  background:linear-gradient(135deg,var(--red),var(--orange));
  color:#fff;box-shadow:0 3px 10px rgba(255,59,92,.3);flex-shrink:0;
  transition:all .2s;
}
.btn-analyze:active{transform:scale(.94)}
.btn-analyze:disabled{background:var(--bg3);color:var(--t3);box-shadow:none;cursor:not-allowed;transform:none}
.btn-analyze.loading{animation:shimmer 1.5s infinite}
@keyframes shimmer{0%,100%{opacity:.7}50%{opacity:1}}
.vira-score-zone{display:flex;align-items:center;gap:16px;padding:16px}
.score-ring-wrap{position:relative;width:72px;height:72px;flex-shrink:0}
.score-ring-svg{transform:rotate(-90deg)}
.score-ring-bg{fill:none;stroke:rgba(255,255,255,.06);stroke-width:6}
.score-ring-fill{fill:none;stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.23,1,.32,1),stroke .3s}
.score-ring-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--fh);font-size:20px;font-weight:800;letter-spacing:-.5px}
.score-label{font-family:var(--fh);font-size:17px;font-weight:800;letter-spacing:-.3px;margin-bottom:2px}
.score-verdict{font-size:12px;color:var(--t2);line-height:1.5}
.vira-axes{padding:0 16px 12px}
.axis-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.axis-name{font-size:12px;color:var(--t2);font-weight:500;width:70px;flex-shrink:0}
.axis-bar-bg{flex:1;height:4px;background:var(--bg4);border-radius:4px;overflow:hidden}
.axis-bar-fill{height:100%;border-radius:4px;width:0;transition:width .6s cubic-bezier(.16,1,.3,1) var(--delay,0s)}
.axis-val{font-size:12px;font-weight:700;width:24px;text-align:right;flex-shrink:0}
.vira-recs{padding:0 16px 14px}
.rec-item{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-bottom:1px solid var(--sep2);font-size:13px;color:var(--t2)}
.rec-item:last-child{border-bottom:none}
.rec-icon{font-size:13px;flex-shrink:0;margin-top:1px}
.rec-item.pos .rec-icon{color:var(--green)}
.rec-item.neg .rec-icon{color:var(--red)}
.rec-item.tip .rec-icon{color:var(--cyan)}
.apply-bar{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;background:rgba(52,211,153,.05);
  border-top:1px solid rgba(52,211,153,.15);gap:12px;
}
.apply-bar-text{font-size:12px;color:var(--green);font-weight:600;flex:1;line-height:1.4}
.btn-apply{
  padding:7px 14px;border:none;border-radius:20px;
  background:var(--green);color:#000;font-family:var(--fn);
  font-size:12px;font-weight:700;cursor:pointer;flex-shrink:0;
  transition:all .15s;
}
.btn-apply:active{transform:scale(.94)}

/* ─── SKELETON ─── */
.skel{
  background:linear-gradient(90deg,var(--bg4) 25%,var(--bg3) 50%,var(--bg4) 75%);
  background-size:200% 100%;
  animation:skel-shine 1.4s infinite;border-radius:6px;
}
@keyframes skel-shine{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ─── OPTIONS ─── */
.sec-lbl{font-size:11px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;margin:16px 2px 8px;padding:0 2px}
.range-row{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--sep2)}
.range-row:last-child{border-bottom:none}
.range-lbl{font-size:14px;font-weight:500;color:var(--t1);width:90px;flex-shrink:0}
.range-wrap{flex:1;position:relative}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:4px;outline:none;cursor:pointer;
  background:linear-gradient(90deg,var(--blue) var(--pct,50%),var(--bg4) var(--pct,50%));
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:20px;height:20px;border-radius:50%;
  background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.4);cursor:pointer;
  transition:transform .15s;
}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.2)}
.range-val{font-size:13px;font-weight:700;color:var(--t1);width:38px;text-align:right;flex-shrink:0}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--sep2)}
.toggle-row:last-child{border-bottom:none}
.toggle-info{flex:1;margin-right:12px}
.toggle-lbl{font-size:15px;color:var(--t1);font-weight:500}
.toggle-desc{font-size:12px;color:var(--t2);margin-top:2px}
.sw{position:relative;width:48px;height:28px;flex-shrink:0}
.sw input{opacity:0;width:0;height:0}
.sw-s{
  position:absolute;inset:0;border-radius:28px;cursor:pointer;
  background:var(--bg4);border:1px solid var(--sep);transition:all .2s;
}
.sw-s::before{
  content:'';position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;
  background:#fff;transition:transform .2s;box-shadow:0 1px 4px rgba(0,0,0,.3);
}
.sw input:checked+.sw-s{background:var(--blue);border-color:var(--blue)}
.sw input:checked+.sw-s::before{transform:translateX(20px)}
.sel-wrap select{
  width:100%;background:var(--bg3);border:1px solid var(--sep);
  border-radius:var(--r3);color:var(--t1);font-family:var(--fn);
  font-size:14px;font-weight:500;padding:9px 12px;outline:none;cursor:pointer;
  -webkit-appearance:none;
}
.lbl{font-size:11px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.4px;display:block;margin-bottom:6px}
.ios-field{padding:14px 16px;border-bottom:1px solid var(--sep2)}
.ios-field:last-child{border-bottom:none}
.ios-field input{
  width:100%;background:transparent;border:none;outline:none;
  font-family:var(--fn);font-size:15px;color:var(--t1);font-weight:500;
}
.ios-field input::placeholder{color:var(--t3)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.coll{overflow:hidden;transition:max-height .3s ease}
.coll.closed{max-height:0!important}
.cinema-section{border-left:3px solid var(--blue)}

/* ─── HISTORY ─── */
.hist-item{
  display:flex;align-items:center;gap:10px;padding:12px 16px;
  border-bottom:1px solid var(--sep2);transition:all .15s;
}
.hist-item:last-child{border-bottom:none}
.hi-run{font-family:var(--fh);font-size:12px;font-weight:800;color:var(--t3);width:32px;flex-shrink:0}
.hi-body{flex:1;cursor:pointer;min-width:0}
.hi-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hi-time{font-size:11px;color:var(--t3);margin-top:1px}
.badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px}
.b-ok{background:var(--green2);color:var(--green)}
.b-fail{background:var(--red2);color:var(--red)}
.b-run{background:var(--blue2);color:#a0a8ff;animation:pulse 2s infinite}
.hist-del-btn{
  width:28px;height:28px;border-radius:50%;background:var(--red2);
  border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:12px;color:var(--red);flex-shrink:0;transition:all .15s;
}
.hist-del-btn:hover{background:var(--red);color:#fff}
.del-confirm-bar{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;background:var(--bg3);border-bottom:1px solid var(--sep2);
  font-size:13px;font-weight:500;gap:12px;
}
.del-confirm-btns{display:flex;gap:8px}
.dcb{padding:7px 14px;border-radius:20px;font-family:var(--fn);font-size:13px;font-weight:600;cursor:pointer;border:none}
.dcb-cancel{background:var(--bg4);color:var(--t2)}
.dcb-ok{background:var(--red);color:#fff}
.btn-clear-all{
  display:flex;align-items:center;justify-content:center;gap:6px;
  width:100%;padding:13px;background:none;border:none;border-top:1px solid var(--sep2);
  font-family:var(--fn);font-size:14px;font-weight:600;color:var(--red);cursor:pointer;
}
.no-data{padding:24px;text-align:center;color:var(--t3);font-size:13px}

/* ─── TICKER ─── */
.ticker{
  background:rgba(255,59,92,.08);border-top:1px solid rgba(255,59,92,.15);
  overflow:hidden;padding:8px 0;flex-shrink:0;
  padding-bottom:calc(var(--safe-bot) + 8px);
}
.ticker-inner{display:flex;gap:0;white-space:nowrap;animation:ticker 24s linear infinite}
.ticker-inner span{font-size:10px;font-weight:700;color:var(--red);letter-spacing:.8px;text-transform:uppercase;padding:0 8px;opacity:.7}
.ticker-inner .dot{color:var(--red);opacity:.3}
@keyframes ticker{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}

/* ─── TEXT INPUTS ─── */
input[type=text]{
  width:100%;background:var(--bg3);border:1px solid var(--sep);
  border-radius:var(--r3);color:var(--t1);font-family:var(--fn);
  font-size:14px;font-weight:500;padding:10px 12px;outline:none;
  transition:border-color .15s;
}
input[type=text]:focus{border-color:var(--blue)}
input[type=password]{
  width:100%;background:transparent;border:none;outline:none;
  font-family:var(--fn);font-size:15px;color:var(--t1);font-weight:500;
}
input[type=password]::placeholder{color:var(--t3)}

/* ─── READY BUTTON ─── */
.btn-ready{
  width:100%;padding:14px;border:none;border-radius:12px;
  font-family:var(--fh);font-size:15px;font-weight:800;letter-spacing:.3px;
  cursor:pointer;
  background:linear-gradient(135deg,var(--red),var(--blue));
  color:#fff;box-shadow:0 4px 16px rgba(255,59,92,.3);
  transition:all .2s;
}
.btn-ready:active{transform:scale(.97)}

/* ─── SCROLLBAR ─── */
::-webkit-scrollbar{width:0;height:0}

/* ═══════════════════════════════════════════
   STORYBOARD PREVIEW  (App-9)
   ═══════════════════════════════════════════ */

/* ── Storyboard card (in tab0, below mode selector) ── */
#storyboardCard{
  display:none;
  background:var(--bg2);border-radius:var(--r);
  border:1px solid var(--sep);margin-bottom:12px;
  overflow:hidden;
  animation:sb-appear .35s cubic-bezier(.16,1,.3,1);
}
@keyframes sb-appear{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.sb-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:13px 16px 11px;
  border-bottom:1px solid var(--sep2);
}
.sb-head-left{display:flex;align-items:center;gap:9px}
.sb-badge{
  width:28px;height:28px;border-radius:8px;
  background:linear-gradient(135deg,var(--red),var(--blue));
  display:flex;align-items:center;justify-content:center;
  font-size:14px;flex-shrink:0;
}
.sb-title{font-family:var(--fh);font-size:13px;font-weight:800;letter-spacing:-.1px}
.sb-sub{font-size:11px;color:var(--t3);margin-top:1px}
.sb-edit-btn{
  font-size:12px;font-weight:600;color:var(--blue);
  background:none;border:none;cursor:pointer;padding:4px 8px;
  border-radius:8px;transition:all .15s;
}
.sb-edit-btn:active{background:var(--blue2)}

/* ── Timeline horizontal scroll ── */
.sb-timeline{
  display:flex;gap:0;
  overflow-x:auto;
  padding:14px 14px 10px;
  scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;
  position:relative;
}
.sb-timeline::-webkit-scrollbar{height:3px}
.sb-timeline::-webkit-scrollbar-track{background:var(--bg4);border-radius:3px}
.sb-timeline::-webkit-scrollbar-thumb{background:var(--sep);border-radius:3px}

/* ── Connector line between clips ── */
.sb-connector{
  width:24px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  position:relative;
}
.sb-connector::before{
  content:'';
  position:absolute;top:50%;left:0;right:0;height:1.5px;
  background:linear-gradient(90deg,var(--sep),var(--sep2));
  transform:translateY(-50%) translateY(-18px);
}
.sb-connector-arrow{
  font-size:9px;color:var(--t3);
  margin-top:-36px;
  z-index:1;position:relative;
}

/* ── Individual clip frame ── */
.sb-frame{
  flex-shrink:0;
  width:76px;
  scroll-snap-align:start;
  display:flex;flex-direction:column;align-items:center;gap:6px;
  cursor:pointer;
  transition:transform .18s cubic-bezier(.34,1.56,.64,1);
  position:relative;
}
.sb-frame:active{transform:scale(.93)}

/* 9:16 thumbnail */
.sb-thumb-wrap{
  width:76px;height:135px;
  border-radius:10px;overflow:hidden;
  position:relative;
  border:2px solid var(--sep);
  transition:border-color .2s,box-shadow .2s;
  background:var(--bg4);
  flex-shrink:0;
}
.sb-frame.role-hook .sb-thumb-wrap{border-color:var(--red);box-shadow:0 0 12px rgba(255,59,92,.25)}
.sb-frame.role-core .sb-thumb-wrap{border-color:var(--cyan);box-shadow:0 0 12px rgba(0,212,255,.18)}
.sb-frame.role-punch .sb-thumb-wrap{border-color:var(--blue);box-shadow:0 0 12px rgba(108,99,255,.3)}
.sb-frame.role-auto .sb-thumb-wrap{border-color:var(--gold)}

.sb-thumb-canvas{width:100%;height:100%;display:block;object-fit:cover}

/* Role ribbon at top of thumb */
.sb-role-ribbon{
  position:absolute;top:0;left:0;right:0;
  padding:5px 6px 4px;
  font-family:var(--fh);font-size:8px;font-weight:800;letter-spacing:.8px;
  text-align:center;text-transform:uppercase;
}
.sb-frame.role-hook .sb-role-ribbon{background:linear-gradient(180deg,rgba(255,59,92,.9),transparent);color:#fff}
.sb-frame.role-core .sb-role-ribbon{background:linear-gradient(180deg,rgba(0,212,255,.8),transparent);color:#fff}
.sb-frame.role-punch .sb-role-ribbon{background:linear-gradient(180deg,rgba(108,99,255,.9),transparent);color:#fff}
.sb-frame.role-auto .sb-role-ribbon{background:linear-gradient(180deg,rgba(245,200,66,.8),transparent);color:#000}

/* Clip number bubble */
.sb-clip-num{
  position:absolute;bottom:5px;left:5px;
  width:16px;height:16px;border-radius:50%;
  background:rgba(0,0,0,.7);
  font-size:8px;font-weight:800;color:#fff;
  display:flex;align-items:center;justify-content:center;
}

/* Effects overlay badges on thumb */
.sb-effects{
  position:absolute;bottom:5px;right:5px;
  display:flex;flex-direction:column;gap:2px;align-items:flex-end;
}
.sb-fx-badge{
  font-size:7px;font-weight:700;
  background:rgba(0,0,0,.75);color:#fff;
  padding:1px 4px;border-radius:3px;letter-spacing:.3px;
}
.sb-fx-badge.zoom{color:var(--gold)}
.sb-fx-badge.sub{color:var(--cyan)}
.sb-fx-badge.smart{color:var(--green)}

/* Duration bar at bottom of thumb */
.sb-dur-bar{
  position:absolute;bottom:0;left:0;right:0;height:3px;
  background:rgba(255,255,255,.1);
}
.sb-dur-fill{
  height:100%;
  transition:width .4s cubic-bezier(.16,1,.3,1);
}
.sb-frame.role-hook .sb-dur-fill{background:var(--red)}
.sb-frame.role-core .sb-dur-fill{background:var(--cyan)}
.sb-frame.role-punch .sb-dur-fill{background:var(--blue)}
.sb-frame.role-auto .sb-dur-fill{background:var(--gold)}

/* Clip name + duration below thumb */
.sb-clip-label{
  font-size:9px;font-weight:600;color:var(--t3);
  text-align:center;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;width:100%;max-width:80px;
  line-height:1.3;
}
.sb-clip-dur{
  font-family:var(--fh);font-size:11px;font-weight:800;
  color:var(--t2);text-align:center;
}

/* ── Total duration bar ── */
.sb-total-bar{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 16px 12px;
  gap:12px;
}
.sb-total-label{font-size:11px;color:var(--t3);font-weight:600;letter-spacing:.3px;text-transform:uppercase;flex-shrink:0}
.sb-total-track{
  flex:1;height:4px;background:var(--bg4);border-radius:4px;overflow:hidden;
}
.sb-total-fill{
  height:100%;border-radius:4px;
  background:linear-gradient(90deg,var(--red),var(--blue));
  transition:width .5s cubic-bezier(.16,1,.3,1);
}
.sb-total-dur{
  font-family:var(--fh);font-size:12px;font-weight:800;
  color:var(--t1);flex-shrink:0;min-width:34px;text-align:right;
}

/* ── Logo splash indicator ── */
.sb-logo-pill{
  flex-shrink:0;
  display:flex;flex-direction:column;align-items:center;gap:6px;
}
.sb-logo-box{
  width:36px;height:64px;
  border-radius:7px;
  background:linear-gradient(160deg,#1a0005,#0a0010);
  border:1.5px solid rgba(255,36,66,.4);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:1px;
  box-shadow:0 0 10px rgba(255,36,66,.15);
  flex-shrink:0;
}
.sb-logo-text{font-family:var(--fh);font-size:5px;font-weight:800;color:rgba(255,255,255,.9);letter-spacing:.3px;line-height:1.15}
.sb-logo-text.crados{font-size:8px;color:#fff}
.sb-logo-text.ai{color:#FF2442;font-size:6px}
.sb-logo-line{width:28px;height:1px;background:#FF2442;opacity:.7;margin:1px 0}
.sb-logo-dur{font-family:var(--fh);font-size:11px;font-weight:800;color:var(--t3);text-align:center}
.sb-logo-lbl{font-size:9px;font-weight:600;color:var(--t3);text-align:center}

/* ── Clip detail bottom sheet ── */
#sbDetail{
  display:none;
  position:fixed;inset:0;z-index:200;
  align-items:flex-end;justify-content:center;
}
#sbDetail.open{display:flex}
.sb-detail-scrim{
  position:absolute;inset:0;background:rgba(0,0,0,.6);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
}
.sb-detail-sheet{
  position:relative;z-index:1;
  width:100%;max-width:430px;
  background:var(--bg2);
  border-radius:24px 24px 0 0;
  border:1px solid var(--sep);
  padding:0 0 calc(var(--safe-bot)+20px);
  animation:sheet-up .3s cubic-bezier(.16,1,.3,1);
  max-height:72vh;overflow-y:auto;
}
@keyframes sheet-up{from{transform:translateY(100%)}to{transform:none}}

.sb-detail-handle{
  width:36px;height:4px;border-radius:4px;background:var(--sep);
  margin:12px auto 16px;
}
.sb-detail-hero{display:flex;gap:16px;padding:0 20px 16px;border-bottom:1px solid var(--sep2)}
.sb-detail-thumb{
  width:72px;height:128px;border-radius:10px;overflow:hidden;background:var(--bg4);flex-shrink:0;
}
.sb-detail-thumb canvas{width:100%;height:100%;display:block}
.sb-detail-info{flex:1;min-width:0}
.sb-detail-name{font-family:var(--fh);font-size:15px;font-weight:800;margin-bottom:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-detail-role-badge{
  display:inline-block;padding:4px 10px;border-radius:20px;
  font-size:11px;font-weight:700;letter-spacing:.3px;margin-bottom:10px;
}
.sb-detail-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.sb-detail-key{font-size:12px;color:var(--t3);font-weight:500}
.sb-detail-val{font-size:13px;font-weight:700;color:var(--t1)}
.sb-detail-effects{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.sb-detail-fx{padding:4px 8px;border-radius:8px;font-size:11px;font-weight:600;background:var(--bg3);color:var(--t2)}
.sb-detail-fx.active{background:rgba(52,211,153,.1);color:var(--green)}

.sb-detail-actions{display:flex;gap:10px;padding:16px 20px 0}
.sb-detail-actions button{flex:1;padding:12px;border:none;border-radius:12px;font-family:var(--fn);font-size:13px;font-weight:700;cursor:pointer;transition:all .15s}
.sb-detail-actions button:active{transform:scale(.95)}
.sb-detail-edit{background:var(--blue2);color:#a0a8ff}
.sb-detail-close{background:var(--bg3);color:var(--t2)}


</head>
<body>
<div id="app">

  <!-- ─── HEADER ─── -->
  <header class="hdr">
    <div class="hdr-logo">
      <div class="hdr-mark">🎞</div>
      <div class="hdr-wordmark">Vira<span>Cut</span></div>
    </div>
    <div class="hdr-right">
      <div class="pill" id="pill"><div class="pill-dot"></div><span id="pillTxt">Offline</span></div>
      <button class="hdr-btn" id="logoutBtn" onclick="logout()">✕</button>
    </div>
  </header>

  <!-- ─── SETUP ─── -->
  <div id="viewSetup" style="flex:1;overflow-y:auto;padding:28px 20px calc(var(--safe-bot)+24px)">
    <div class="setup-hero">
      <div class="setup-hero-logo">🎞</div>
      <h1>Vira<span>Cut</span> Studio</h1>
      <p>Montage IA · Les Crados.Ai<br>GitHub Actions · FFmpeg · TikTok 9:16</p>
    </div>
    <div class="setup-card">
      <div class="setup-field">
        <label>GitHub Token</label>
        <input type="password" id="tk" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" autocomplete="off">
      </div>
      <div class="setup-field">
        <label>Repository</label>
        <input type="text" id="repoIn" value="xfville-art/App" placeholder="owner/repo">
      </div>
      <div class="setup-field">
        <label>Clé Anthropic <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--t3)">(optionnel)</span></label>
        <input type="password" id="anthropicKey" placeholder="sk-ant-api03-..." autocomplete="off">
      </div>
    </div>
    <button class="btn-login" onclick="init()">Accéder au Studio →</button>
  </div>

  <!-- ─── STUDIO ─── -->
  <div id="viewStudio" style="display:none;flex-direction:column;flex:1;overflow:hidden">

    <!-- TABS -->
    <div class="tabs">
      <div class="tab active" onclick="tab(0)"><span class="tab-icon">⚡</span>Rendu<div class="tab-dot" id="td0"></div><div class="tab-bar"></div></div>
      <div class="tab" onclick="tab(1)"><span class="tab-icon">🎬</span>Clips<div class="tab-dot show" id="td1"></div><div class="tab-bar"></div></div>
      <div class="tab" onclick="tab(2)"><span class="tab-icon">🎛</span>Options<div class="tab-bar"></div></div>
      <div class="tab" onclick="tab(3)"><span class="tab-icon">📋</span>Runs<div class="tab-dot" id="td3"></div><div class="tab-bar"></div></div>
    </div>

    <!-- TAB 0 — RENDU -->
    <div class="tab-pane active" id="tp0">

      <!-- Stats -->
      <div class="stats">
        <div class="stat"><span class="stat-v g" id="sRuns">—</span><div class="stat-l">Runs</div></div>
        <div class="stat"><span class="stat-v b" id="sDur">—</span><div class="stat-l">Dernier</div></div>
        <div class="stat"><span class="stat-v r" id="sFail">—</span><div class="stat-l">Échecs</div></div>
      </div>

      <!-- Mode -->
      <div class="card">
        <div class="card-head">
          <div class="card-title">Mode de montage</div>
        </div>
        <div class="modes">
          <div class="mode-btn active-auto" id="mBtn-auto" onclick="setMode('auto')">
            <span class="mode-icon">🤖</span><span class="mode-name">AUTO</span><span class="mode-desc">Détecte auto</span>
          </div>
          <div class="mode-btn" id="mBtn-punch" onclick="setMode('punch')">
            <span class="mode-icon">⚡</span><span class="mode-name">PUNCH</span><span class="mode-desc">Viral 7–9s</span>
          </div>
          <div class="mode-btn" id="mBtn-cinema" onclick="setMode('cinema')">
            <span class="mode-icon">🎬</span><span class="mode-name">CINÉMA</span><span class="mode-desc">Long 26s</span>
          </div>
        </div>
        <div class="mode-hint" id="modeHint"></div>
      </div>

      <!-- STORYBOARD PREVIEW (App-9) -->
      <div class="card" id="storyboardCard">
        <div class="sb-head">
          <div class="sb-head-left">
            <div class="sb-badge">🎞</div>
            <div>
              <div class="sb-title">Storyboard Preview</div>
              <div class="sb-sub" id="sbSubtitle">Timeline avant montage</div>
            </div>
          </div>
          <button class="sb-edit-btn" onclick="tab(1)">Modifier →</button>
        </div>
        <!-- Timeline scroll -->
        <div class="sb-timeline" id="sbTimeline"></div>
        <!-- Total duration bar -->
        <div class="sb-total-bar">

<script>
/* ── GARDE-FOU GLOBAL — affiche les erreurs au lieu d'écran noir ── */
window.onerror = function(msg, src, line, col, err){
  const d = document.getElementById('app');
  if(d) d.innerHTML = '<div style="padding:24px;color:#ff3b5c;font-family:monospace;font-size:13px;background:#0a0a0f;min-height:100vh"><b>⚠ JS ERROR</b><br><br>' + msg + '<br>L' + line + ':' + col + '<br><br>' + (err ? err.stack||'' : '') + '</div>';
  return false;
};

/* ══ STATE ══ */
let token,repo='xfville-art/App',branch='main',wfFile='viracut.yml',anthropicApiKey='';
let startTime,timerInterval,dispatchTime;
let clips=[],manualOrder=false,dragSrc=null;
let currentMode='auto';
let _recommendedClipOrder=null;
const ROLES=['auto','hook','core','punch'];
const ROLE_LABEL={auto:'AUTO',hook:'HOOK',core:'CORE',punch:'PUNCH'};

const STEPS={
  punch:['Encodage Base64 & upload GitHub','Dispatch GitHub Actions','Extraction & analyse clips','Vision IA + classification','Découpe · Colour grading · Zoom','Assemblage · Stickers IA · Merge','Génération artifact'],
  cinema:['Encodage Base64 & upload GitHub','Dispatch GitHub Actions','Extraction & analyse clips','Ken Burns + Crossfade','Vision IA + Textes cinéma','Logo · Letterbox · Overlay','Génération artifact'],
  auto:['Encodage Base64 & upload GitHub','Dispatch GitHub Actions','Extraction & analyse clips','Détection mode + IA','Effets visuels (Ken Burns ou Punch)','Assemblage final + Stickers','Génération artifact']
};
const MODE_HINTS={
  auto:'🤖 AUTO — clips courts → PUNCH · clips longs ou 1 seul → CINÉMA',
  punch:'⚡ PUNCH — court viral (7–9s) · hook, core, punchline + stickers IA',
  cinema:'🎬 CINÉMA — long (26s) · Ken Burns · letterbox · logo permanent',
};

/* ══ STEPS ══ */
function renderSteps(){
  const labels=STEPS[currentMode]||STEPS.auto;
  document.getElementById('stepsList').innerHTML=labels.map((lbl,i)=>`
    <div class="step" id="step${i}">
      <div class="step-n">${i+1}</div>
      <div class="step-lbl">${lbl}</div>
      <div class="step-note" id="sn${i}"></div>
    </div>`).join('');
}

/* ══ MODE ══ */
function setMode(m){
  currentMode=m;
  ['','2'].forEach(suf=>{
    ['auto','punch','cinema'].forEach(n=>{
      const el=document.getElementById('mBtn'+suf+'-'+n);
      if(el) el.className='mode-btn'+(n===m?' active-'+n:'');
    });
  });
  document.getElementById('modeHint').textContent=MODE_HINTS[m];
  document.getElementById('optPunch').style.display=(m!=='cinema')?'block':'none';
  document.getElementById('optCinema').style.display=(m!=='punch')?'block':'none';
  renderSteps();updateChips();
  // Rebuild storyboard with new mode durations
  if(clips.length) buildStoryboard();
}

/* ══ STORAGE SAFE — fonctionne aussi en content:// (Brave Android) ══ */
const _store={
  get(k){try{return localStorage.getItem(k);}catch(e){return null;}},
  set(k,v){try{localStorage.setItem(k,v);}catch(e){}},
  del(k){try{localStorage.removeItem(k);}catch(e){}}
};

/* ══ AUTH ══ */
document.getElementById('tk').addEventListener('keydown',e=>{if(e.key==='Enter')init()});
(function(){
  try{
    const t=_store.get('vc_token');
    const r=_store.get('vc_repo');
    const a=_store.get('vc_anthropic');
    if(t){token=t;if(r){repo=r;document.getElementById('repoIn').value=r;}if(a)anthropicApiKey=a;_goStudio();}
    else{if(r)document.getElementById('repoIn').value=r;if(a)document.getElementById('anthropicKey').value=a;}
  }catch(e){
    // content:// context — afficher le setup normalement
    document.getElementById('viewSetup').style.display='block';
  }
})();

function init(){
  token=document.getElementById('tk').value.trim();
  repo=document.getElementById('repoIn').value.trim()||repo;
  anthropicApiKey=document.getElementById('anthropicKey').value.trim();
  if(!token)return;
  _store.set('vc_token',token);
  _store.set('vc_repo',repo);
  _store.set('vc_anthropic',anthropicApiKey);
  _goStudio();
}
function _goStudio(){
  document.getElementById('viewSetup').style.display='none';
  const vs=document.getElementById('viewStudio');vs.style.display='flex';vs.style.flexDirection='column';
  document.getElementById('repoEdit').value=repo;
  document.getElementById('pill').classList.add('ok');
  document.getElementById('pillTxt').textContent='ONLINE';
  document.getElementById('logoutBtn').style.display='flex';
  initRanges();setMode('auto');loadStats();
}
function logout(){
  _store.del('vc_token');_store.del('vc_repo');_store.del('vc_anthropic');
  token='';anthropicApiKey='';
  document.getElementById('pill').classList.remove('ok');
  document.getElementById('pillTxt').textContent='Offline';
  document.getElementById('logoutBtn').style.display='none';
  document.getElementById('viewStudio').style.display='none';
  document.getElementById('viewSetup').style.display='block';
  document.getElementById('tk').value='';
}

/* ══ TABS ══ */
function tab(n){
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',i===n));
  document.querySelectorAll('.tab-pane').forEach((p,i)=>p.classList.toggle('active',i===n));
  if(n===3)loadHistory();
}

/* ══ UTILS ══ */
function togColl(bid,btnId,openLbl,closeLbl){
  const b=document.getElementById(bid),btn=document.getElementById(btnId);
  const open=!b.classList.contains('closed');
  b.classList.toggle('closed',open);
  btn.textContent=open?openLbl:closeLbl;
}
function rng(el,vid,unit='s'){
  document.getElementById(vid).textContent=el.value+unit;
  const pct=((el.value-el.min)/(el.max-el.min))*100;
  el.style.setProperty('--pct',pct+'%');
  updateChips();
}
function initRanges(){
  const unitMap={rCinXfade:'s',rKbZoom:'×',rLbH:'px',rScdet:'',rZoomSc:'×'};
  document.querySelectorAll('input[type=range]').forEach(el=>{
    const pct=((el.value-el.min)/(el.max-el.min))*100;
    el.style.setProperty('--pct',pct+'%');
    const vid=el.getAttribute('oninput')?.match(/rng\(this,'(\w+)'/)?.[1];
    if(vid){const unit=unitMap[el.id]||'s';const span=document.getElementById(vid);if(span)span.textContent=el.value+unit;}
  });
}

/* ══ THUMBNAIL GENERATOR ══ */
function generateThumbnail(file, canvasEl){
  const video=document.createElement('video');
  video.muted=true;video.playsInline=true;
  const url=URL.createObjectURL(file);
  video.src=url;
  video.addEventListener('loadeddata',()=>{
    video.currentTime=Math.min(0.5,video.duration*0.1);
  });
  video.addEventListener('seeked',()=>{
    const ctx=canvasEl.getContext('2d');
    canvasEl.width=54*2;canvasEl.height=72*2;
    // Crop center (fill)
    const vr=video.videoWidth/video.videoHeight;
    const cr=54/72;
    let sx=0,sy=0,sw=video.videoWidth,sh=video.videoHeight;
    if(vr>cr){sw=video.videoHeight*cr;sx=(video.videoWidth-sw)/2;}
    else{sh=video.videoWidth/cr;sy=(video.videoHeight-sh)/2;}
    ctx.drawImage(video,sx,sy,sw,sh,0,0,canvasEl.width,canvasEl.height);
    URL.revokeObjectURL(url);
    // Store duration
    const durEl=canvasEl.closest('.clip-thumb')?.querySelector('.clip-thumb-dur');
    if(durEl&&video.duration){
      const d=video.duration;
      durEl.textContent=d<60?d.toFixed(1)+'s':Math.floor(d/60)+'m'+Math.floor(d%60)+'s';
    }
  });
  video.load();
}

// Resolve final role of a clip given its position and total count
function resolveRole(clip, idx, total){
  if(clip.role !== 'auto') return clip.role;
  if(total === 1) return 'punch';
  if(idx === 0) return 'hook';
  if(idx === total - 1) return 'punch';
  return 'core';
}

// Estimate render duration per clip based on current config + role
function estimateRenderDur(role, srcDur){
  const cfg = getConfig();
  const mode = currentMode;
  if(mode === 'punch'){
    if(role === 'hook')  return Math.min(parseFloat(cfg.hook_dur)||2.0, srcDur||99);
    if(role === 'core')  return srcDur || parseFloat(cfg.core_dur)||2.5;
    if(role === 'punch') return srcDur || parseFloat(cfg.punch_dur)||3.0;
  }
  // cinema / auto — use clip_dur approximation
  const n = clips.length;
  const target = Math.max(parseFloat(cfg.cinema_dur)||12, n * 3.0);
  return Math.min(target / n, srcDur || 99);
}

// Role display helpers
const ROLE_COLORS = {hook:'var(--red)',core:'var(--cyan)',punch:'var(--blue)',auto:'var(--gold)'};
const ROLE_NAMES  = {hook:'HOOK',core:'CORE',punch:'PUNCH',auto:'AUTO'};
const ROLE_ICONS  = {hook:'🎣',core:'⚙',punch:'💥',auto:'🤖'};

// Store source durations extracted from video elements
const _sbSrcDurs = {};

function buildStoryboard(){
  const card = document.getElementById('storyboardCard');
  const tl   = document.getElementById('sbTimeline');
  if(!clips.length){ card.style.display='none'; return; }

  card.style.display='block';
  const cfg = getConfig();
  const mode = currentMode;
  const n = clips.length;

  // Compute max target duration for the progress bar reference
  const LOGO_DUR = 2.5;
  let maxTarget = LOGO_DUR;
  if(mode === 'punch'){
    maxTarget += (parseFloat(cfg.hook_dur)||2)+(parseFloat(cfg.core_dur)||2.5)+(parseFloat(cfg.punch_dur)||3);
    maxTarget = Math.min(maxTarget, 15 + LOGO_DUR);
  } else {
    maxTarget += parseFloat(cfg.cinema_dur)||12;
  }

  // Build timeline HTML
  let html = '';
  clips.forEach((c, i) => {
    const role   = resolveRole(c, i, n);
    const color  = ROLE_COLORS[role];
    const label  = ROLE_NAMES[role];

    // Effects badges
    const fxBadges = [];
    if(role === 'hook'  && cfg.zoom_punch) fxBadges.push({cls:'zoom', txt:'ZOOM+'});
    if(role === 'punch' && cfg.zoom_punch) fxBadges.push({cls:'zoom', txt:'ZOOM×'});
    if(cfg.stickers) fxBadges.push({cls:'sub', txt:'🎯'});
    fxBadges.push({cls:'smart', txt:'SC'});

    const fxHtml = fxBadges.map(b=>`<div class="sb-fx-badge ${b.cls}">${b.txt}</div>`).join('');

    if(i > 0){
      html += `<div class="sb-connector"><div class="sb-connector-arrow">▶</div></div>`;
    }

    html += `
    <div class="sb-frame role-${role}" id="sbf${i}" onclick="openSbDetail(${i})">
      <div class="sb-thumb-wrap" id="sbt${i}">
        <canvas id="sbc${i}" class="sb-thumb-canvas"></canvas>
        <div class="sb-role-ribbon">${label}</div>
        <div class="sb-clip-num">${i+1}</div>
        <div class="sb-effects">${fxHtml}</div>
        <div class="sb-dur-bar"><div class="sb-dur-fill" id="sbdf${i}" style="width:0%"></div></div>
      </div>
      <div class="sb-clip-dur" id="sbdur${i}">—</div>
      <div class="sb-clip-label">${c.file.name.replace(/\.[^.]+$/,'').slice(0,10)}</div>
    </div>`;
  });

  // Logo splash indicator
  html += `
    <div class="sb-connector"><div class="sb-connector-arrow">▶</div></div>
    <div class="sb-logo-pill">
      <div class="sb-logo-box">
        <div class="sb-logo-text">LES</div>
        <div class="sb-logo-text crados">CRADOS</div>
        <div class="sb-logo-line"></div>
        <div class="sb-logo-text ai">.Ai</div>
      </div>
      <div class="sb-logo-dur">2.5s</div>
      <div class="sb-logo-lbl">OUTRO</div>
    </div>`;

  tl.innerHTML = html;

  // Generate thumbnails + read durations
  setTimeout(() => {
    clips.forEach((c, i) => {
      const canvas = document.getElementById('sbc'+i);
      if(canvas) sbGenerateThumbnail(c.file, canvas, i, maxTarget);
    });
  }, 60);

  // Update subtitle
  const modeLabel = {auto:'AUTO',punch:'PUNCH',cinema:'CINÉMA'}[mode]||mode.toUpperCase();
  document.getElementById('sbSubtitle').textContent = `${n} clip${n>1?'s':''} · Mode ${modeLabel}`;
}

function sbGenerateThumbnail(file, canvas, idx, maxTarget){
  const video = document.createElement('video');
  video.muted=true; video.playsInline=true;
  const url = URL.createObjectURL(file);
  video.src = url;

  video.addEventListener('loadeddata', ()=>{
    // Seek to 20% for a more representative frame
    video.currentTime = Math.min(video.duration*0.2, 2.0);
  });

  video.addEventListener('seeked', ()=>{
    // Draw 9:16 crop
    canvas.width  = 76*2;
    canvas.height = 135*2;
    const ctx = canvas.getContext('2d');
    const vr = video.videoWidth / video.videoHeight;
    const cr = 76 / 135;
    let sx=0,sy=0,sw=video.videoWidth,sh=video.videoHeight;
    if(vr > cr){ sw = video.videoHeight*cr; sx=(video.videoWidth-sw)/2; }
    else        { sh = video.videoWidth/cr;  sy=(video.videoHeight-sh)/2; }
    ctx.drawImage(video, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
    URL.revokeObjectURL(url);

    // Store source duration
    const srcDur = video.duration || 0;
    _sbSrcDurs[idx] = srcDur;

    // Determine role
    const role = resolveRole(clips[idx], idx, clips.length);
    const renderDur = estimateRenderDur(role, srcDur);

    // Update duration label
    const durEl = document.getElementById('sbdur'+idx);
    if(durEl) durEl.textContent = renderDur.toFixed(1)+'s';

    // Duration fill bar (relative to max segment allowed)
    const maxSegDur = maxTarget / clips.length;
    const pct = Math.min(renderDur / Math.max(maxSegDur, 1) * 100, 100);
    const fill = document.getElementById('sbdf'+idx);
    setTimeout(()=>{ if(fill) fill.style.width = pct+'%'; }, 100 + idx*80);

    // Recompute total after all durations collected
    sbUpdateTotal(maxTarget);
  });
  video.load();
}

function sbUpdateTotal(maxTarget){
  const LOGO = 2.5;
  let total = LOGO;
  let allReady = true;
  clips.forEach((c, i) => {
    const role = resolveRole(c, i, clips.length);
    const srcDur = _sbSrcDurs[i];
    if(srcDur === undefined){ allReady=false; return; }
    total += estimateRenderDur(role, srcDur);
  });
  if(!allReady) return;

  const durEl = document.getElementById('sbTotalDur');
  if(durEl) durEl.textContent = total.toFixed(1)+'s';

  const fill = document.getElementById('sbTotalFill');
  const MAX_DISPLAY = currentMode === 'punch' ? 17.5 : (parseFloat(getConfig().cinema_dur)||12) + LOGO + 2;
  const pct = Math.min(total / MAX_DISPLAY * 100, 100);
  setTimeout(()=>{ if(fill) fill.style.width = pct+'%'; }, 400);
}

  const srcDur = _sbSrcDurs[idx];
  document.getElementById('sbDetailDur').textContent = srcDur ? srcDur.toFixed(2)+'s' : '—';

  const renderDur = estimateRenderDur(role, srcDur);

  // Effects list

    {label:'Grade BD',   active: true},
    {label:'Logo Splash',active: idx===clips.length-1},
  ];
  document.getElementById('sbDetailFx').innerHTML = effects
    .map(e=>`<span class="sb-detail-fx${e.active?' active':''}">${e.active?'✓ ':''} ${e.label}</span>`)
    .join('');

  // Thumbnail in detail
  const detailCanvas = document.getElementById('sbDetailCanvas');
  detailCanvas.width = 72*2; detailCanvas.height = 128*2;
  const srcCanvas = document.getElementById('sbc'+idx);
  if(srcCanvas && srcCanvas.width > 0){
    const ctx = detailCanvas.getContext('2d');
    ctx.drawImage(srcCanvas, 0, 0, detailCanvas.width, detailCanvas.height);
  }

  document.getElementById('sbDetail').classList.add('open');
}

function closeSbDetail(){
  document.getElementById('sbDetail').classList.remove('open');
  _sbDetailIdx = -1;
}

/* ══ UI UPDATE ══ */
function updateUI(pct,title,sub,active,note=''){
  const fill=document.getElementById('pFill');
  fill.style.width=pct+'%';
  fill.className='prog-fill'+(pct>0&&pct<100?' run':'')+(pct===100?' done':'');
  document.getElementById('pPct').textContent=pct+'%';
  document.getElementById('pTitle').textContent=title.toUpperCase();
  document.getElementById('pSub').textContent=sub;
  for(let i=0;i<7;i++){
    const el=document.getElementById('step'+i),sn=document.getElementById('sn'+i);
    if(!el)continue;
    el.className='step';
    if(i<active){el.classList.add('done');sn.textContent='✓';}
    else if(i===active){el.classList.add('run');sn.textContent=note;}
    else{sn.textContent='';}
  }
}
function startTimer(){startTime=Date.now();clearInterval(timerInterval);timerInterval=setInterval(()=>{const s=Math.floor((Date.now()-startTime)/1000);document.getElementById('pTimer').textContent=s+'S ÉCOULÉES'},1000);}
function stopTimer(){clearInterval(timerInterval);document.getElementById('pTimer').textContent='';}

/* ══ LAUNCH / PROCESS / MONITOR ══ */
function launch(){if(!clips.length){tab(1);return;}document.getElementById('launchBtn').disabled=true;process();}

async function process(){
  startTimer();
  updateUI(5,'Encodage','Lecture des fichiers…',0,'…');
  const vids=[];
  for(let i=0;i<clips.length;i++){
    const c=clips[i];
    updateUI(5+i*4,'Encodage',c.file.name,0,`${i+1}/${clips.length}`);
    const b64=await new Promise(r=>{const rd=new FileReader();rd.onload=()=>r(btoa(rd.result));rd.readAsBinaryString(c.file)});
    vids.push({data:b64,role:c.role});
  }
  updateUI(22,'Upload','Envoi vers GitHub…',0,'↑');
  try{
    let sha='';
    const getRes=await fetch(`https://api.github.com/repos/${repo}/contents/p.json`,{headers:{'Authorization':`Bearer ${token}`}});
    if(getRes.ok){const getJson=await getRes.json();sha=getJson.sha||'';}
    const putRes=await fetch(`https://api.github.com/repos/${repo}/contents/p.json`,{
      method:'PUT',headers:{'Authorization':`Bearer ${token}`,'Content-Type':'application/json'},
      body:JSON.stringify({message:'vid',content:btoa(unescape(encodeURIComponent(JSON.stringify({videos:vids,options:getConfig()})))),...(sha?{sha}:{})})
    });
    if(!putRes.ok){const err=await putRes.json().catch(()=>({}));updateUI(0,'Erreur upload','Erreur '+putRes.status+' : '+(err.message||'vérifier droits token'),0,'✗');stopTimer();return;}
  }catch(e){updateUI(0,'Erreur upload','Impossible de pousser p.json : '+e.message,0,'✗');stopTimer();return;}
  updateUI(36,'Démarrage','GitHub Actions en initialisation…',1,'…');
  try{
    await fetch(`https://api.github.com/repos/${repo}/actions/workflows/${wfFile}/dispatches`,{
      method:'POST',headers:{'Authorization':`Bearer ${token}`,'Content-Type':'application/json'},
      body:JSON.stringify({ref:branch})
    });
  }catch(e){updateUI(0,'Erreur dispatch','Impossible de lancer le workflow',1,'✗');stopTimer();return;}
  dispatchTime=new Date().toISOString();
  setTimeout(monitor,6000);
}

function runPhaseToStep(run){
  const elapsed=(Date.now()-new Date(run.created_at))/1000;
  const m=currentMode;
  if(m==='cinema'){
    if(elapsed<20)return[2,'Analyse…'];if(elapsed<60)return[3,'Ken Burns…'];
    if(elapsed<100)return[4,'IA Cinéma…'];if(elapsed<130)return[5,'Overlay…'];
    return[6,'Finalisation…'];
  }
  if(elapsed<20)return[2,'Analyse clips…'];if(elapsed<50)return[3,'Vision IA…'];
  if(elapsed<85)return[4,'FFmpeg…'];if(elapsed<115)return[5,'Stickers…'];
  return[6,'Finalisation…'];
}

async function monitor(){
  try{
    const res=await fetch(`https://api.github.com/repos/${repo}/actions/runs?per_page=5`,{headers:{'Authorization':`Bearer ${token}`}}).then(r=>r.json());
    const runs=res.workflow_runs||[];
    const run=dispatchTime?runs.find(r=>new Date(r.created_at)>=new Date(dispatchTime)-30000&&!(r.name||'').toLowerCase().includes('analyz')):runs.find(r=>!(r.name||'').toLowerCase().includes('analyz'));
    if(!run){setTimeout(monitor,5000);return;}
    const ll=document.getElementById('logsLink');ll.style.display='block';ll.href=run.html_url;
    const s=Math.floor((Date.now()-startTime)/1000);
    const pct=Math.min(92,36+s*0.6);
    if(run.status==='completed'){
      stopTimer();
      if(run.conclusion==='success'){
        updateUI(100,'Rendu terminé','output.mp4 disponible dans les Artifacts',6,'✓');
        showResult(run);loadStats();
        document.getElementById('td0').classList.add('show');
      }else{updateUI(0,'Erreur de rendu','Consulter les logs GitHub Actions',2,'✗');showRetry();}
    }else{
      const[stepIdx,stepLabel]=runPhaseToStep(run);
      updateUI(pct,'Rendu en cours',stepLabel,stepIdx,s+'s');
      setTimeout(monitor,5000);
    }
  }catch(e){updateUI(0,'Erreur réseau','Retry dans 10 secondes…',-1);setTimeout(monitor,10000);}
}

function showResult(run){
  const dur=Math.round((new Date(run.updated_at)-new Date(run.created_at))/1000);
  const modeLabel={auto:'Auto',punch:'Punch',cinema:'Cinéma'}[currentMode]||currentMode;
  document.getElementById('resultZone').innerHTML=`
    <div class="result">
      <div class="result-head">
        <div class="result-icon">✅</div>
        <div>
          <div class="result-title">Montage prêt · ${modeLabel}</div>
          <div class="result-sub">Run #${run.run_number} · ${dur}s · artifact : viracut-output</div>
        </div>
      </div>
      <div class="result-body">
        <a href="${run.html_url}" target="_blank" class="btn btn-green" style="text-decoration:none">Télécharger output.mp4 ↓</a>
        <p style="font-size:12px;color:var(--t2);text-align:center;line-height:1.8;font-weight:500">
          Ouvrir le run → section <strong>Artifacts</strong><br>Fichier : <strong>viracut-output</strong>
        </p>
        <button class="btn btn-ghost" onclick="location.reload()">Nouveau montage</button>
      </div>
    </div>`;
}
function showRetry(){document.getElementById('resultZone').innerHTML=`<div style="margin-top:10px"><button class="btn btn-ghost" onclick="location.reload()">Recommencer</button></div>`;}

/* ══ HISTORY ══ */
let _cachedRuns=[];
async function loadHistory(){
  const list=document.getElementById('histList');
  list.innerHTML='<div class="no-data">Chargement…</div>';
  document.getElementById('clearAllBtn').style.display='none';
  document.getElementById('delConfirmZone').innerHTML='';
  try{
    const res=await fetch(`https://api.github.com/repos/${repo}/actions/runs?per_page=20`,{headers:{'Authorization':`Bearer ${token}`}}).then(r=>r.json());
    _cachedRuns=res.workflow_runs||[];
    if(!_cachedRuns.length){list.innerHTML='<div class="no-data">Aucun run trouvé</div>';return;}
    renderHistList();
    document.getElementById('td3').classList.add('show');
    document.getElementById('clearAllBtn').style.display='flex';
  }catch(e){list.innerHTML='<div class="no-data">Erreur de chargement</div>';}
}
function renderHistList(){
  const list=document.getElementById('histList');
  list.innerHTML=_cachedRuns.map(r=>{
    const d=new Date(r.created_at);
    const ts=d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
    const dur=r.updated_at?Math.round((new Date(r.updated_at)-d)/1000)+'s':'…';
    const[bcls,blbl]=r.conclusion==='success'?['b-ok','Succès']:r.conclusion==='failure'?['b-fail','Erreur']:['b-run','…'];
    return`<div class="hist-item" id="hi-${r.id}">
      <div class="hi-run">#${r.run_number}</div>
      <div class="hi-body" onclick="window.open('${r.html_url}','_blank')">
        <div class="hi-name">${r.name||'ViraCut'}</div>
        <div class="hi-time">${ts} · ${dur}</div>
      </div>
      <span class="badge ${bcls}">${blbl}</span>
      <button class="hist-del-btn" onclick="askDelete(${r.id},${r.run_number})">🗑</button>
    </div>`;
  }).join('');
}
function askDelete(runId,runNum){
  const z=document.getElementById('delConfirmZone');
  z.innerHTML=`<div class="del-confirm-bar"><span>Supprimer le run #${runNum} ?</span><div class="del-confirm-btns"><button class="dcb dcb-cancel" onclick="document.getElementById('delConfirmZone').innerHTML=''">Annuler</button><button class="dcb dcb-ok" onclick="deleteRun(${runId})">Supprimer</button></div></div>`;
  z.scrollIntoView({behavior:'smooth',block:'nearest'});
}
async function deleteRun(runId){
  document.getElementById('delConfirmZone').innerHTML='';
  const el=document.getElementById('hi-'+runId);
  if(el){el.style.opacity='.3';el.style.pointerEvents='none';}
  try{
    const resp=await fetch(`https://api.github.com/repos/${repo}/actions/runs/${runId}`,{method:'DELETE',headers:{'Authorization':`Bearer ${token}`}});
    if(resp.status===204||resp.ok){
      _cachedRuns=_cachedRuns.filter(r=>r.id!==runId);renderHistList();
      if(!_cachedRuns.length){document.getElementById('histList').innerHTML='<div class="no-data">Aucun run</div>';document.getElementById('clearAllBtn').style.display='none';document.getElementById('td3').classList.remove('show');}
      loadStats();
    }else{const err=await resp.json().catch(()=>({}));if(el){el.style.opacity='1';el.style.pointerEvents='';}alert('Erreur '+resp.status+' : '+(err.message||'impossible de supprimer'));}
  }catch(e){if(el){el.style.opacity='1';el.style.pointerEvents='';}alert('Erreur réseau : '+e.message);}
}
function confirmClearAll(){
  const z=document.getElementById('delConfirmZone');
  z.innerHTML=`<div class="del-confirm-bar"><span>Supprimer tous les ${_cachedRuns.length} runs ?</span><div class="del-confirm-btns"><button class="dcb dcb-cancel" onclick="document.getElementById('delConfirmZone').innerHTML=''">Annuler</button><button class="dcb dcb-ok" onclick="deleteAllRuns()">Tout supprimer</button></div></div>`;
}
async function deleteAllRuns(){
  document.getElementById('delConfirmZone').innerHTML='';
  document.getElementById('histList').innerHTML='<div class="no-data">Suppression en cours…</div>';
  document.getElementById('clearAllBtn').style.display='none';
  for(const run of _cachedRuns){await fetch(`https://api.github.com/repos/${repo}/actions/runs/${run.id}`,{method:'DELETE',headers:{'Authorization':`Bearer ${token}`}}).catch(()=>{});await new Promise(r=>setTimeout(r,250));}
  _cachedRuns=[];document.getElementById('histList').innerHTML='<div class="no-data">Historique supprimé</div>';
  document.getElementById('td3').classList.remove('show');loadStats();
}
function saveConfig(e){
  repo=document.getElementById('repoEdit').value.trim()||repo;
  branch=document.getElementById('branchEdit').value.trim()||'main';
  wfFile=document.getElementById('wfEdit').value.trim()||'viracut.yml';
  _store.set('vc_repo',repo);
  const btn=e.target,prev=btn.textContent;
  btn.textContent='ENREGISTRÉ ✓';setTimeout(()=>btn.textContent=prev,2000);
}

/* ══ VIRALITÉ ══ */
function getScoreColor(s){if(s>=80)return'var(--green)';if(s>=60)return'var(--orange)';return'var(--red)';}
function getScoreLabel(s){
  if(s>=85)return['🚀 Viral potentiel','Structure explosive — prêt à décoller'];
  if(s>=70)return['⚡ Très bon','Solide — quelques ajustements peuvent tout changer'];
  if(s>=55)return['⚠️ Moyen','Potentiel présent mais structure à retravailler'];
  return['❌ Faible','Risque de drop-off élevé — revoir les clips'];
}
function renderScoreRing(score){
  const c=getScoreColor(score),r=30,circ=2*Math.PI*r,offset=circ*(1-score/100);
  return`<div class="score-ring-wrap"><svg class="score-ring-svg" width="72" height="72" viewBox="0 0 72 72"><circle class="score-ring-bg" cx="36" cy="36" r="${r}"/><circle class="score-ring-fill" cx="36" cy="36" r="${r}" stroke="${c}" stroke-dasharray="${circ}" stroke-dashoffset="${offset}"/></svg><div class="score-ring-num" style="color:${c}">${score}</div></div>`;
}
function renderAxes(axes){
  return`<div class="vira-axes">`+axes.map((a,i)=>{const c=getScoreColor(a.score);return`<div class="axis-row"><div class="axis-name">${a.name}</div><div class="axis-bar-bg"><div class="axis-bar-fill" style="width:${a.score}%;background:${c};--delay:${i*0.08}s"></div></div><div class="axis-val" style="color:${c}">${a.score}</div></div>`;}).join('')+`</div>`;
}
function renderRecs(recs){
  return`<div class="vira-recs">`+recs.map(r=>`<div class="rec-item ${r.type}"><span class="rec-icon">${r.type==='pos'?'✓':r.type==='neg'?'✗':'→'}</span><span>${r.text}</span></div>`).join('')+`</div>`;
}
function showViraSkeleton(){
  document.getElementById('viraBody').innerHTML=`<div style="padding:16px"><div class="skel" style="height:14px;width:60%;margin-bottom:10px"></div><div class="skel" style="height:10px;width:90%;margin-bottom:6px"></div><div class="skel" style="height:10px;width:75%;margin-bottom:18px"></div><div class="skel" style="height:4px;width:100%;margin-bottom:7px;border-radius:4px"></div><div class="skel" style="height:4px;width:100%;margin-bottom:7px;border-radius:4px"></div><div class="skel" style="height:4px;width:100%;border-radius:4px"></div></div>`;
}
function showViraResult(data){
  const card=document.getElementById('viraCard');card.classList.add('has-score');
  const[label,verdict]=getScoreLabel(data.score);const c=getScoreColor(data.score);
  document.getElementById('viraSubtitle').textContent=`Score global · ${clips.length} clip${clips.length>1?'s':''}`;
  document.getElementById('viraBody').innerHTML=`<div class="vira-score-zone">${renderScoreRing(data.score)}<div class="score-meta"><div class="score-label" style="color:${c}">${label}</div><div class="score-verdict">${verdict}</div></div></div>${renderAxes(data.axes)}<div style="height:1px;background:var(--sep2);margin:0 16px 10px"></div>${renderRecs(data.recs)}`;
}
let viraAnalysisDispatchTime=null;
async function analyzeViralite(){
  if(!clips.length)return;
  if(!token){alert('Connecte-toi d\'abord');return;}
  const btn=document.getElementById('btnAnalyze');
  btn.disabled=true;btn.textContent='⏳ Analyse…';btn.classList.add('loading');
  document.getElementById('viraCard').classList.remove('has-score');
  showViraSkeleton();
  document.getElementById('viraSubtitle').textContent='Envoi vers GitHub Actions…';
  const clipsMeta=clips.map((c,i)=>({index:i+1,name:c.file.name,role:c.role,size_mb:parseFloat((c.file.size/1048576).toFixed(2)),type:c.file.type||'video/mp4'}));
  const analyzePayload={analyze_only:true,clips_meta:clipsMeta,current_mode:currentMode,options:(()=>{const c=getConfig();delete c.anthropic_key;return c;})()};
  try{
    let sha='';
    const exRes=await fetch(`https://api.github.com/repos/${repo}/contents/pa.json`,{headers:{'Authorization':`Bearer ${token}`}});
    if(exRes.ok){const ex=await exRes.json();sha=ex.sha||'';}
    const uploadRes=await fetch(`https://api.github.com/repos/${repo}/contents/pa.json`,{method:'PUT',headers:{'Authorization':`Bearer ${token}`,'Content-Type':'application/json'},body:JSON.stringify({message:'viralite-analyze',content:btoa(unescape(encodeURIComponent(JSON.stringify(analyzePayload)))),...(sha?{sha}:{})})});
    if(!uploadRes.ok){const err=await uploadRes.json().catch(()=>({}));showViraError('Upload échoué '+uploadRes.status+' : '+(err.message||'vérifier droits token'));resetAnalyzeBtn(btn);return;}
  }catch(e){showViraError('Upload impossible : '+e.message);resetAnalyzeBtn(btn);return;}
  document.getElementById('viraSubtitle').textContent='Vérification upload…';
  let uploadConfirmed=false;
  for(let i=0;i<8;i++){
    await new Promise(r=>setTimeout(r,2000));
    try{const check=await fetch(`https://api.github.com/repos/${repo}/contents/pa.json`,{headers:{'Authorization':`Bearer ${token}`}});if(check.ok){uploadConfirmed=true;break;}}catch(e){}
  }
  if(!uploadConfirmed){showViraError('pa.json non confirmé sur GitHub après 16s — réessayer');resetAnalyzeBtn(btn);return;}
  document.getElementById('viraSubtitle').textContent='GitHub Actions en cours…';
  try{await fetch(`https://api.github.com/repos/${repo}/actions/workflows/viracut_analyze.yml/dispatches`,{method:'POST',headers:{'Authorization':`Bearer ${token}`,'Content-Type':'application/json'},body:JSON.stringify({ref:branch})});}
  catch(e){showViraError('Dispatch échoué : '+e.message);resetAnalyzeBtn(btn);return;}
  viraAnalysisDispatchTime=new Date().toISOString();
  monitorViraAnalysis(btn,0);
}
async function monitorViraAnalysis(btn,attempt){
  if(attempt>40){showViraError('Timeout — workflow trop long (>3min)');resetAnalyzeBtn(btn);return;}
  try{
    const res=await fetch(`https://api.github.com/repos/${repo}/actions/runs?per_page=10`,{headers:{'Authorization':`Bearer ${token}`}}).then(r=>r.json());
    const runs=res.workflow_runs||[];
    const cutoff=new Date(viraAnalysisDispatchTime)-180000;
    const run=runs.find(r=>r.name&&r.name.toLowerCase().includes('analyz')&&new Date(r.created_at)>=cutoff)||runs.find(r=>new Date(r.created_at)>=cutoff&&r.name&&!r.name.toUpperCase().includes('VIRACUT\u0020'));
    if(!run){setTimeout(()=>monitorViraAnalysis(btn,attempt+1),5000);return;}
    if(run.status!=='completed'){const elapsed=Math.floor((Date.now()-new Date(viraAnalysisDispatchTime))/1000);document.getElementById('viraSubtitle').textContent=`Analyse IA en cours… ${elapsed}s`;setTimeout(()=>monitorViraAnalysis(btn,attempt+1),5000);return;}
    if(run.conclusion!=='success'){showViraError('Workflow échoué — voir logs GitHub Actions');resetAnalyzeBtn(btn);return;}
    const jobsRes=await fetch(`https://api.github.com/repos/${repo}/actions/runs/${run.id}/jobs`,{headers:{'Authorization':`Bearer ${token}`}}).then(r=>r.json());
    const job=(jobsRes.jobs||[])[0];if(!job){showViraError('Job introuvable');resetAnalyzeBtn(btn);return;}
    const logsRes=await fetch(`https://api.github.com/repos/${repo}/actions/jobs/${job.id}/logs`,{headers:{'Authorization':`Bearer ${token}`}});
    if(!logsRes.ok){showViraError('Logs inaccessibles ('+logsRes.status+')');resetAnalyzeBtn(btn);return;}
    const logText=await logsRes.text();
    const SM='##VIRALITE_JSON_START##',EM='##VIRALITE_JSON_END##';
    const si=logText.indexOf(SM),ei=logText.indexOf(EM);
    if(si===-1||ei===-1){showViraError('Résultat JSON introuvable dans les logs');resetAnalyzeBtn(btn);return;}
    const rawJson=logText.slice(si+SM.length,ei).trim();
    let data;
    try{const start=rawJson.indexOf('{');if(start===-1)throw new Error('Aucun { trouvé');let depth=0,end=-1;for(let i=start;i<rawJson.length;i++){if(rawJson[i]==='{')depth++;else if(rawJson[i]==='}'){depth--;if(depth===0){end=i;break;}}}if(end===-1)throw new Error('JSON incomplet');data=JSON.parse(rawJson.slice(start,end+1));}
    catch(e){showViraError('Parsing JSON échoué : '+e.message);resetAnalyzeBtn(btn);return;}
    showViraResult(data);
    document.getElementById('viraSubtitle').textContent=`Score pré-rendu · ${clips.length} clip${clips.length>1?'s':''}`;
    if(data.recommended_config)applyRecommendedConfig(data);
    resetAnalyzeBtn(btn,true);
  }catch(e){showViraError('Erreur : '+e.message);resetAnalyzeBtn(btn);}
}
function applyRecommendedConfig(data){
  const rc=data.recommended_config;if(!rc)return;
  if(rc.mode)setMode(rc.mode);
  if(rc.hook_dur!==undefined){const el=document.getElementById('rHook');el.value=Math.min(Math.max(rc.hook_dur,parseFloat(el.min)),parseFloat(el.max));rng(el,'vHook');}
  if(rc.core_dur!==undefined){const el=document.getElementById('rCore');el.value=Math.min(Math.max(rc.core_dur,parseFloat(el.min)),parseFloat(el.max));rng(el,'vCore');}
  if(rc.punch_dur!==undefined){const el=document.getElementById('rPunch');el.value=Math.min(Math.max(rc.punch_dur,parseFloat(el.min)),parseFloat(el.max));rng(el,'vPunch');}
  if(rc.flash_cut!==undefined)document.getElementById('oFlash').checked=rc.flash_cut;
  if(rc.zoom_punch!==undefined)document.getElementById('oZoom').checked=rc.zoom_punch;
  if(rc.ai_text!==undefined)document.getElementById('oText').checked=rc.ai_text;
  updateChips();
  if(rc.clip_order&&Array.isArray(rc.clip_order)&&rc.clip_order.length===clips.length){_recommendedClipOrder=rc.clip_order;clips=rc.clip_order.map(i=>clips[i]);renderFileList();}
  showApplyBanner(data);
  // Rebuild storyboard with new order + config
  if(clips.length) buildStoryboard();
}
function showApplyBanner(data){
  const body=document.getElementById('viraBody');if(!body)return;
  const summary=[];const rc=data.recommended_config||{};
  if(rc.mode)summary.push(`Mode → ${rc.mode.toUpperCase()}`);
  if(rc.clip_order)summary.push('Clips réordonnés');
  if(rc.hook_dur)summary.push(`Hook ${rc.hook_dur}s`);
  const banner=document.createElement('div');banner.className='apply-bar';
  banner.innerHTML=`<span class="apply-bar-text">✓ Config optimisée appliquée — ${summary.join(' · ')}</span><button class="btn-apply" onclick="tab(0)">Lancer →</button>`;
  body.appendChild(banner);
  document.getElementById('launchBtn').disabled=false;
  document.getElementById('td0').classList.add('show');
}
function showViraError(msg){
  const body=document.getElementById('viraBody');
  if(body)body.innerHTML=`<div style="padding:14px 16px;font-size:13px;color:var(--red);font-weight:500">⚠ ${msg}</div>`;
  document.getElementById('viraSubtitle').textContent='Évalue le potentiel TikTok avant montage';
}
function resetAnalyzeBtn(btn,success=false){
  btn.disabled=false;btn.classList.remove('loading');
  btn.textContent=success?'🔄 Re-analyser':'🔥 Analyser';
}
